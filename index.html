<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tap Counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 0%, #1c1830 0%, #0a0a12 55%, #050507 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  #app {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* ambient glow blobs */
  #app::before, #app::after {
    content: "";
    position: absolute;
    width: 45vmax; height: 45vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  #app::before {
    background: #7c3aed;
    top: -15vmax; left: -10vmax;
  }
  #app::after {
    background: #06b6d4;
    bottom: -15vmax; right: -10vmax;
  }

  #ring-wrap {
    position: relative;
    width: min(60vmin, 480px);
    height: min(60vmin, 480px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  #ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  #ring circle {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
  }

  #ring .track {
    stroke: rgba(255,255,255,0.08);
  }

  #ring .progress {
    stroke: url(#grad);
    stroke-dasharray: 1256;
    stroke-dashoffset: 1256;
    transition: stroke-dashoffset 0.25s ease;
  }

  #core {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 0 60px rgba(124, 58, 237, 0.15), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  #count {
    font-size: 16vw;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: transform 0.08s ease;
  }

  #count.pulse {
    transform: scale(1.1);
  }

  #hint {
    margin-top: 10px;
    font-size: clamp(12px, 1.6vmin, 15px);
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 600;
  }

  #phase {
    margin-top: 6px;
    font-size: clamp(11px, 1.4vmin, 13px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 700;
    background: linear-gradient(135deg, #c4b5fd, #67e8f9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #phase.show {
    opacity: 1;
    transform: translateY(0);
  }

  #volume {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    z-index: 10;
  }

  #volume svg {
    width: 16px;
    height: 16px;
    color: rgba(255,255,255,0.55);
    flex-shrink: 0;
  }

  #volume input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 90px;
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(to right, #7c3aed, #06b6d4);
    cursor: pointer;
  }

  #volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(196, 181, 253, 0.9);
    cursor: pointer;
  }

  #volume input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(196, 181, 253, 0.9);
    cursor: pointer;
  }

  #reset {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }

  #reset:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
  }

  #reset:active {
    transform: translateX(-50%) scale(0.96);
  }

  #reset kbd {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 12px;
    font-family: inherit;
  }

  #toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    padding: 16px 28px;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    border-radius: 14px;
    font-weight: 700;
    font-size: clamp(14px, 2vmin, 18px);
    box-shadow: 0 10px 40px rgba(124, 58, 237, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 20;
    white-space: nowrap;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #titles {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    text-align: center;
    width: 90vw;
    max-width: 700px;
    pointer-events: none;
  }

  #title {
    font-size: clamp(32px, 6vmin, 56px);
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #fff 0%, #c4b5fd 50%, #7c3aed 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(124, 58, 237, 0.5);
  }

  #subtitle {
    margin-top: 10px;
    font-size: clamp(12px, 1.8vmin, 16px);
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.01em;
  }

  /* realms */
  .realm {
    position: fixed;
    top: 0; bottom: 0;
    width: min(14vw, 140px);
    z-index: 0;
    pointer-events: none;
  }
  .realm.spiritual {
    left: 0;
    background: linear-gradient(to right, rgba(124,58,237,0.28), transparent);
  }
  .realm.physical {
    right: 0;
    background: linear-gradient(to left, rgba(6,182,212,0.22), transparent);
  }
  .realm span {
    position: absolute;
    top: 50%; left: 50%;
    writing-mode: vertical-rl;
    transform: translate(-50%, -50%);
    text-transform: uppercase;
    letter-spacing: 0.3em;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.3);
  }

  /* root/ember background */
  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  /* floating cosmic / angelic symbols */
  #symbols {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .symbol {
    position: absolute;
    filter: drop-shadow(0 0 6px currentColor);
    animation: symbol-float ease-in-out infinite;
    will-change: transform, opacity;
  }
  .symbol svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .symbol.spirit { color: rgba(196, 181, 253, 0.55); }
  .symbol.phys { color: rgba(103, 232, 249, 0.5); }

  @keyframes symbol-float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-16px) rotate(4deg); }
  }
</style>
</head>
<body>
<div class="realm spiritual"><span>Spiritual</span></div>
<div class="realm physical"><span>Physical</span></div>
<canvas id="bg-canvas"></canvas>
<div id="symbols"></div>
<div id="app">
  <div id="titles">
    <div id="title">The God Challenge</div>
    <div id="subtitle">Imagining, Musing, Muttering &rarr; Manifesting to Natural from Spiritual</div>
  </div>
  <div id="ring-wrap">
    <svg id="ring" viewBox="0 0 420 420">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed"/>
          <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="210" cy="210" r="200"/>
      <circle class="progress" cx="210" cy="210" r="200"/>
    </svg>
    <div id="core">
      <div id="count">0</div>
      <div id="hint">tap anywhere</div>
      <div id="phase"></div>
    </div>
  </div>
</div>

<div id="toast">🎉 100 taps reached!</div>
<button id="reset">Reset <kbd>R</kbd></button>
<div id="volume">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="4 9 8 9 12 5 12 19 8 15 4 15" fill="currentColor" stroke="none"/>
    <path d="M16 8a5 5 0 0 1 0 8"/>
    <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
  </svg>
  <input type="range" id="volume-slider" min="0" max="100" value="70" aria-label="Effect volume">
</div>

<script>
  const STORAGE_KEY = 'god-challenge-count';
  let count = 0;
  try {
    const saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (Number.isFinite(saved) && saved >= 0) count = Math.min(saved, 100);
  } catch (e) {}

  const countEl = document.getElementById('count');
  const app = document.getElementById('app');
  const resetBtn = document.getElementById('reset');
  const progressEl = document.querySelector('#ring .progress');
  const toastEl = document.getElementById('toast');
  const phaseEl = document.getElementById('phase');
  const CIRC = 1256; // 2 * PI * 200, matches stroke-dasharray

  const PHASES = [
    { max: 25, label: 'Imagining' },
    { max: 50, label: 'Musing' },
    { max: 75, label: 'Muttering' },
    { max: 100, label: 'Manifesting' },
  ];
  function phaseForCount(c) {
    return PHASES.find((p) => c <= p.max) || PHASES[PHASES.length - 1];
  }
  let lastPhaseLabel = null;
  function updatePhase() {
    const phase = phaseForCount(count);
    if (phase.label !== lastPhaseLabel) {
      lastPhaseLabel = phase.label;
      phaseEl.textContent = phase.label;
      phaseEl.classList.remove('show');
      void phaseEl.offsetWidth;
      phaseEl.classList.add('show');
    }
  }

  const MILESTONES = {
    25: 'Imagining takes root 🌱',
    50: 'Musing deepens the current 🌊',
    75: 'Muttering becomes conviction 🔥',
    100: '🎉 Manifesting — 100 taps reached!',
  };
  const VOLUME_KEY = 'god-challenge-volume';
  const volumeSlider = document.getElementById('volume-slider');
  let effectVolume = 0.7;
  try {
    const savedVol = parseInt(localStorage.getItem(VOLUME_KEY), 10);
    if (Number.isFinite(savedVol) && savedVol >= 0 && savedVol <= 100) effectVolume = savedVol / 100;
  } catch (e) {}
  volumeSlider.value = Math.round(effectVolume * 100);

  let audioCtx = null;
  let masterGain = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = effectVolume;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  volumeSlider.addEventListener('input', () => {
    effectVolume = volumeSlider.value / 100;
    if (masterGain) masterGain.gain.value = effectVolume;
    try { localStorage.setItem(VOLUME_KEY, volumeSlider.value); } catch (e) {}
  });

  function updateDisplay() {
    countEl.textContent = count;
    countEl.classList.remove('pulse');
    void countEl.offsetWidth;
    countEl.classList.add('pulse');

    const pct = Math.min(count / 100, 1);
    progressEl.style.strokeDashoffset = CIRC * (1 - pct);
    setRootProgress(pct);
    updatePhase();

    try { localStorage.setItem(STORAGE_KEY, String(count)); } catch (e) {}
  }

  // ---- Root / ember background engine (canvas) ----
  const canvas = document.getElementById('bg-canvas');
  const bctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Floating cosmic / angelic background symbols (line-art SVG, no emoji) ----
  const SPIRIT_ICONS = [
    // dove / wing
    '<svg viewBox="0 0 24 24"><path d="M2 13c3-3 6-1 8 1 1-4 4-7 8-7-1 3-3 5-3 5s3 0 5 2c-4 1-7 0-9-1-1 2-3 4-6 4 1-1 1-2 1-3-2 1-3 0-4-1z"/></svg>',
    // feather
    '<svg viewBox="0 0 24 24"><path d="M18 3c-6 1-11 6-12 12l-2 6 6-2C16 17 21 12 22 6l-4 4M13 8l-4 4M15 11l-4 4"/></svg>',
    // halo ring
    '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7" ry="2.4"/><path d="M12 9v11M9 15h6"/></svg>',
    // radiant star
    '<svg viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M5.6 5.6l3 3M15.4 15.4l3 3M18.4 5.6l-3 3M8.6 15.4l-3 3"/></svg>',
    // sparkle
    '<svg viewBox="0 0 24 24"><path d="M12 3c0 4 2 6 6 6-4 0-6 2-6 6 0-4-2-6-6-6 4 0 6-2 6-6z"/></svg>',
  ];
  const PHYS_ICONS = [
    // ringed planet
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="3" transform="rotate(-20 12 12)"/></svg>',
    // crescent moon
    '<svg viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 0 18 7 7 0 1 1 0-18z"/></svg>',
    // simple star
    '<svg viewBox="0 0 24 24"><path d="M12 4l2.2 5.6L20 11l-4.6 3.6L16.5 20 12 16.8 7.5 20l1.1-5.4L4 11l5.8-1.4z"/></svg>',
    // orbit / galaxy swirl
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(15 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-35 12 12)"/></svg>',
    // leaf
    '<svg viewBox="0 0 24 24"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16z"/><path d="M5 19c3-5 7-9 12-11"/></svg>',
  ];

  function initSymbols() {
    const container = document.getElementById('symbols');
    const total = 16;
    for (let i = 0; i < total; i++) {
      const isSpirit = i % 2 === 0;
      const icons = isSpirit ? SPIRIT_ICONS : PHYS_ICONS;
      const el = document.createElement('div');
      el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
      el.className = `symbol ${isSpirit ? 'spirit' : 'phys'}`;
      const leftPct = isSpirit ? Math.random() * 30 : 70 + Math.random() * 30;
      const size = 16 + Math.random() * 22;
      el.style.left = `${leftPct}%`;
      el.style.top = `${8 + Math.random() * 78}%`;
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      el.style.opacity = (0.25 + Math.random() * 0.35).toFixed(2);
      if (!reducedMotion) {
        el.style.animationDuration = `${8 + Math.random() * 10}s`;
        el.style.animationDelay = `${-Math.random() * 10}s`;
      } else {
        el.style.animation = 'none';
      }
      container.appendChild(el);
    }
  }
  initSymbols();

  let W = 0, H = 0;
  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }

  // ---- Scene 2: river flowing from the temple doors, golden pebbles, embers ----
  const spiritColor = [124, 58, 237];
  const physColor = [6, 182, 212];
  const goldColor = [255, 200, 90];
  function riverColorAt(t, alpha) {
    const c = t < 0.6
      ? spiritColor
      : [
          lerp(spiritColor[0], physColor[0], (t - 0.6) / 0.4),
          lerp(spiritColor[1], physColor[1], (t - 0.6) / 0.4),
          lerp(spiritColor[2], physColor[2], (t - 0.6) / 0.4),
        ];
    return `rgba(${c[0] | 0}, ${c[1] | 0}, ${c[2] | 0}, ${alpha})`;
  }

  const RIVER_Y0 = 0.54;
  function riverCenterY(x, time) {
    return RIVER_Y0
      + Math.sin(x * 3.1 + 0.6) * 0.055
      + Math.sin(x * 1.15 - 0.3) * 0.035
      + (reducedMotion ? 0 : Math.sin(time * 0.00014 + x * 4.2) * 0.012);
  }
  function riverHalfWidth(x, growth) {
    return (0.032 + x * 0.05) * (0.55 + 0.55 * growth);
  }

  // golden pebbles resting in the riverbed, denser near the temple (spiritual origin)
  // and revealing progressively further out as the river grows
  const PEBBLE_BASE = 20;
  const PEBBLE_MAX_EXTRA = 26;
  const pebbles = [];
  for (let i = 0; i < PEBBLE_BASE + PEBBLE_MAX_EXTRA; i++) {
    pebbles.push({
      x: rand(0.02, 0.92),
      offsetFrac: rand(-0.8, 0.8),
      size: rand(1.4, 3.6),
      phase: rand(0, Math.PI * 2),
      glowSpeed: rand(0.0012, 0.0026),
    });
  }
  pebbles.sort((a, b) => a.x - b.x);

  // embers: ambient drifters + a few riding the current from temple to the far bank
  const EMBER_BASE = 24;
  const EMBER_MAX_EXTRA = 18;
  const embers = [];
  for (let i = 0; i < EMBER_BASE + EMBER_MAX_EXTRA; i++) {
    embers.push({
      x: Math.random(), y: Math.random(),
      vx: rand(0.00006, 0.00016),
      vy: rand(-0.00004, 0.00004),
      size: rand(0.8, 2.2),
      baseAlpha: rand(0.15, 0.4),
      phase: rand(0, Math.PI * 2),
    });
  }
  const flowEmbers = [];
  for (let i = 0; i < 22; i++) {
    flowEmbers.push({
      t: Math.random(),
      speed: rand(0.00008, 0.00019),
      size: rand(1.3, 2.5),
      offsetFrac: rand(-0.6, 0.6),
    });
  }

  const BASE_GROWTH = 0.82; // river starts mostly formed; taps add subtle refinement
  let progress = BASE_GROWTH;
  let targetProgress = BASE_GROWTH;
  let tapPct = 0; // raw count/100, drives density + brightness
  function setRootProgress(p) {
    tapPct = clamp01(p);
    targetProgress = BASE_GROWTH + (1 - BASE_GROWTH) * tapPct;
    if (reducedMotion) {
      progress = targetProgress;
      renderScene(0);
    }
  }

  function drawTempleDoor(time) {
    const cx = 0.012 * W;
    const cy = riverCenterY(0, time) * H;
    const doorW = Math.min(W, H) * 0.09;
    const doorH = doorW * 2.1;
    const glow = 0.6 + 0.4 * Math.sin(time * 0.0009);

    bctx.save();
    bctx.shadowColor = `rgba(255, 214, 130, ${0.5 + 0.3 * glow})`;
    bctx.shadowBlur = 22;
    bctx.strokeStyle = `rgba(255, 224, 160, ${0.55 + 0.25 * glow})`;
    bctx.lineWidth = 2;
    bctx.beginPath();
    bctx.moveTo(cx, cy + doorH * 0.5);
    bctx.lineTo(cx, cy - doorH * 0.15);
    bctx.quadraticCurveTo(cx, cy - doorH * 0.5, cx + doorW * 0.5, cy - doorH * 0.5);
    bctx.quadraticCurveTo(cx + doorW, cy - doorH * 0.5, cx + doorW, cy - doorH * 0.15);
    bctx.lineTo(cx + doorW, cy + doorH * 0.5);
    bctx.stroke();
    bctx.beginPath();
    bctx.moveTo(cx + doorW * 0.5, cy - doorH * 0.5);
    bctx.lineTo(cx + doorW * 0.5, cy + doorH * 0.5);
    bctx.lineWidth = 1;
    bctx.stroke();
    bctx.restore();

    // light rays fanning out from the doorway, reaching further as taps progress
    const rayCount = 7;
    const rayLen = (0.12 + 0.22 * progress) * Math.max(W, H);
    bctx.save();
    for (let i = 0; i < rayCount; i++) {
      const angle = -0.5 + (i / (rayCount - 1)) * 1.0;
      const flicker = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.0006 + i * 1.3));
      const grad = bctx.createLinearGradient(
        cx + doorW * 0.5, cy,
        cx + doorW * 0.5 + Math.cos(angle) * rayLen, cy + Math.sin(angle) * rayLen
      );
      grad.addColorStop(0, `rgba(255, 230, 170, ${0.22 * flicker})`);
      grad.addColorStop(1, 'rgba(255, 230, 170, 0)');
      bctx.strokeStyle = grad;
      bctx.lineWidth = 3;
      bctx.beginPath();
      bctx.moveTo(cx + doorW * 0.5, cy);
      bctx.lineTo(cx + doorW * 0.5 + Math.cos(angle) * rayLen, cy + Math.sin(angle) * rayLen);
      bctx.stroke();
    }
    bctx.restore();
  }

  function renderScene(time) {
    bctx.clearRect(0, 0, W, H);

    const growth = progress; // 0.82..1, subtle refinement driven by taps
    const revealX = Math.min(0.94, growth * 1.02);

    drawTempleDoor(time);

    // river band: sampled top/bottom edges, filled with the spiritual->physical gradient
    const STEPS = 90;
    bctx.save();
    bctx.shadowColor = 'rgba(124, 58, 237, 0.25)';
    bctx.shadowBlur = 16;
    const grad = bctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, riverColorAt(0, 0.55));
    grad.addColorStop(0.6, riverColorAt(0.6, 0.45));
    grad.addColorStop(1, riverColorAt(1, 0.35));
    bctx.fillStyle = grad;
    bctx.beginPath();
    for (let i = 0; i <= STEPS; i++) {
      const x = revealX * (i / STEPS);
      const y = (riverCenterY(x, time) - riverHalfWidth(x, growth)) * H;
      if (i === 0) bctx.moveTo(x * W, y); else bctx.lineTo(x * W, y);
    }
    for (let i = STEPS; i >= 0; i--) {
      const x = revealX * (i / STEPS);
      const y = (riverCenterY(x, time) + riverHalfWidth(x, growth)) * H;
      bctx.lineTo(x * W, y);
    }
    bctx.closePath();
    bctx.fill();
    bctx.restore();

    // bright glowing centerline current
    bctx.save();
    bctx.shadowColor = 'rgba(200, 230, 255, 0.6)';
    bctx.shadowBlur = 10;
    bctx.strokeStyle = 'rgba(230, 240, 255, 0.35)';
    bctx.lineWidth = 1.4;
    bctx.beginPath();
    for (let i = 0; i <= STEPS; i++) {
      const x = revealX * (i / STEPS);
      const y = riverCenterY(x, time) * H;
      if (i === 0) bctx.moveTo(x * W, y); else bctx.lineTo(x * W, y);
    }
    bctx.stroke();
    bctx.restore();

    // golden pebbles glowing in the riverbed, revealed progressively from the temple outward
    const activePebbles = Math.min(pebbles.length, PEBBLE_BASE + Math.round(tapPct * PEBBLE_MAX_EXTRA));
    for (let i = 0; i < activePebbles; i++) {
      const pb = pebbles[i];
      if (pb.x > revealX) continue;
      const cy = riverCenterY(pb.x, time) + pb.offsetFrac * riverHalfWidth(pb.x, growth) * 0.8;
      const glow = 0.55 + 0.45 * Math.sin(time * pb.glowSpeed + pb.phase);
      bctx.save();
      bctx.shadowColor = `rgba(255, 200, 90, ${0.7 * glow})`;
      bctx.shadowBlur = pb.size * 3;
      bctx.beginPath();
      bctx.arc(pb.x * W, cy * H, pb.size * (0.8 + 0.3 * glow), 0, Math.PI * 2);
      bctx.fillStyle = `rgba(${goldColor[0]}, ${goldColor[1]}, ${goldColor[2]}, ${0.55 + 0.35 * glow})`;
      bctx.fill();
      bctx.restore();
    }

    // ambient embers drifting between the realms
    const activity = 1 + progress * 0.6;
    const activeEmberCount = Math.min(embers.length, EMBER_BASE + Math.round(tapPct * EMBER_MAX_EXTRA));
    const brightBoost = 1 + tapPct * 0.9;
    embers.slice(0, activeEmberCount).forEach((e) => {
      if (!reducedMotion) {
        e.x += e.vx * activity * 16;
        e.y += e.vy * activity * 16 + Math.sin(time * 0.0004 + e.phase) * 0.00002;
        if (e.x > 1.05) { e.x = -0.05; e.y = Math.random(); }
      }
      const flicker = reducedMotion ? 1 : 0.7 + 0.3 * Math.sin(time * 0.0015 + e.phase);
      bctx.save();
      bctx.shadowColor = 'rgba(255, 210, 140, 0.85)';
      bctx.shadowBlur = 8 + tapPct * 6;
      bctx.beginPath();
      bctx.arc(e.x * W, e.y * H, e.size * (1 + tapPct * 0.3), 0, Math.PI * 2);
      bctx.fillStyle = `rgba(255, 230, 190, ${Math.min(1, (e.baseAlpha * flicker + 0.15) * brightBoost)})`;
      bctx.fill();
      bctx.restore();
    });

    // embers riding the current from the temple doors out toward the physical bank
    flowEmbers.forEach((fe) => {
      if (revealX < 0.05) return;
      if (!reducedMotion) {
        fe.t += fe.speed * activity * 16;
        if (fe.t > revealX) fe.t = 0;
      } else {
        fe.t = Math.min(fe.t, revealX);
      }
      const x = Math.min(fe.t, revealX);
      const y = riverCenterY(x, time) + fe.offsetFrac * riverHalfWidth(x, progress) * 0.7;
      const alpha = Math.min(1, 0.85 * (1 - (fe.t / Math.max(0.01, revealX)) * 0.3) * (1 + tapPct * 0.6));
      bctx.save();
      bctx.shadowColor = 'rgba(255, 235, 200, 0.95)';
      bctx.shadowBlur = 10 + tapPct * 8;
      bctx.beginPath();
      bctx.arc(x * W, y * H, fe.size * (1 + tapPct * 0.25), 0, Math.PI * 2);
      bctx.fillStyle = `rgba(255, 250, 235, ${alpha})`;
      bctx.fill();
      bctx.restore();
    });
  }

  function tick(time) {
    progress += (targetProgress - progress) * 0.05;
    renderScene(time);
    requestAnimationFrame(tick);
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  if (reducedMotion) {
    renderScene(0);
  } else {
    requestAnimationFrame(tick);
  }

  function showToast(message) {
    if (message) toastEl.textContent = message;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function playAlertSound() {
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      [0, 0.15, 0.3].forEach((delay) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0, now + delay);
        gain.gain.linearRampToValueAtTime(0.3, now + delay + 0.02);
        gain.gain.linearRampToValueAtTime(0, now + delay + 0.13);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now + delay);
        osc.stop(now + delay + 0.15);
      });
    } catch (e) {}
  }

  function playTapSound() {
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.06);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.06);
    } catch (e) {}
  }

  function increment() {
    count++;
    updateDisplay();
    playTapSound();
    if (MILESTONES[count]) {
      playAlertSound();
      showToast(MILESTONES[count]);
    }
  }

  function reset() {
    count = 0;
    lastPhaseLabel = null;
    updateDisplay();
  }

  // sync UI with any restored count, without the tap pulse/sound
  countEl.textContent = count;
  progressEl.style.strokeDashoffset = CIRC * (1 - Math.min(count / 100, 1));
  setRootProgress(Math.min(count / 100, 1));
  updatePhase();

  app.addEventListener('click', increment);

  resetBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    reset();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
      reset();
    }
  });

  function requestFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  window.addEventListener('load', () => {
    requestFullscreen();
  });

  document.addEventListener('click', function once() {
    if (!document.fullscreenElement) requestFullscreen();
  }, { once: false });
</script>
</body>
</html>
