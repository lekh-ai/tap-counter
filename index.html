  // ---- speech-to-text affirmation: on-device recognition only (no external API) ----
  // as the verse is spoken aloud, matched words glow; finishing the whole verse
  // counts as a tap. Uses the browser's built-in SpeechRecognition (Web Speech API),
  // which on Safari/Mac and Chrome runs through the OS/browser's own speech engine.
  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let matchedCount = 0;
  let pendingConfirm = false; // whole verse spoken once; waiting for the last word to be repeated
  let awaitingReset = false; // just confirmed — ignore further results until the flash clears

  // some browsers' hi-IN recognizer transcribes speech as Romanized ("Hinglish")
  // text rather than Devanagari, which would never match a Devanagari verse at
  // all — so Devanagari is approximately transliterated to the same Latin form
  // before comparing, on both the verse text and (if it ever comes back that
  // way) the spoken words.
  const DEVANAGARI_CONSONANTS = {
    'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ng',
    'च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'ny',
    'ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n',
    'त':'t','थ':'th','द':'d','ध':'dh','न':'n',
    'प':'p','फ':'ph','ब':'b','भ':'bh','म':'m',
    'य':'y','र':'r','ल':'l','व':'v',
    'श':'sh','ष':'sh','स':'s','ह':'h','ळ':'l',
    'क़':'q','ख़':'kh','ग़':'gh','ज़':'z','ड़':'r','ढ़':'rh','फ़':'f',
  };
  const DEVANAGARI_MATRAS = {
    'ा':'a', 'ि':'i', 'ी':'i', 'ु':'u', 'ू':'u', 'ृ':'ri',
    'े':'e', 'ै':'ai', 'ो':'o', 'ौ':'au', 'ं':'n', 'ः':'h', 'ँ':'n',
  };
  const DEVANAGARI_VOWELS = {
    'अ':'a', 'आ':'a', 'इ':'i', 'ई':'i', 'उ':'u', 'ऊ':'u', 'ऋ':'ri',
    'ए':'e', 'ऐ':'ai', 'ओ':'o', 'औ':'au', 'ॐ':'om',
  };
  const DEVANAGARI_DIGITS = '०१२३४५६७८९';

  function devanagariToRoman(str) {
    const chars = Array.from(str);
    let out = '';
    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      if (DEVANAGARI_CONSONANTS[c]) {
        out += DEVANAGARI_CONSONANTS[c];
        const next = chars[i + 1];
        if (next === '्') { i++; } // virama: suppress the inherent vowel
        else if (next && DEVANAGARI_MATRAS[next]) { out += DEVANAGARI_MATRAS[next]; i++; }
        else { out += 'a'; }
      } else if (DEVANAGARI_VOWELS[c]) {
        out += DEVANAGARI_VOWELS[c];
      } else if (DEVANAGARI_MATRAS[c]) {
        out += DEVANAGARI_MATRAS[c];
      } else if (DEVANAGARI_DIGITS.includes(c)) {
        out += DEVANAGARI_DIGITS.indexOf(c);
      } else {
        out += c;
      }
    }
    return out;
  }

  function normalizeWord(w) {
    const roman = /[ऀ-ॿ]/.test(w) ? devanagariToRoman(w) : w;
    return roman.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  }

  function expectedWords() {
    return Array.from(verseTextEl.querySelectorAll('.verse-word'))
      .map((el) => normalizeWord(el.textContent));
  }

  function resetAffirmProgress() {
    matchedCount = 0;
    pendingConfirm = false;
    verseTextEl.querySelectorAll('.verse-word.said, .verse-word.confirm-pending')
      .forEach((el) => el.classList.remove('said', 'confirm-pending'));
  }

  function applyAffirmProgress() {
    const spans = verseTextEl.querySelectorAll('.verse-word');
    spans.forEach((el, i) => el.classList.toggle('said', i < matchedCount));
  }

  // aligns the freshly transcribed spoken words against the words still left to
  // affirm, tolerating a few misheard/filler words rather than requiring an exact
  // match. If a word doesn't line up, this also looks ahead into the verse itself
  // for the next place the spoken word actually occurs and jumps (glows) straight
  // to it — safe to be this lenient because nothing counts as a tap until the
  // last word is confirmed by saying (or tapping) it a second time.
  function advanceAffirmation(spokenWords) {
    if (awaitingReset) return; // just confirmed a tap — ignore stray results until the flash clears
    const expected = expectedWords();
    if (!expected.length) return;

    // "Ameen Ameen" / "Amen Amen" hard-confirms the tap on its own, regardless of
    // how much of the verse has been heard so far — glow the whole verse and count it
    if (hasAmeenAmeen(spokenWords)) {
      matchedCount = expected.length;
      applyAffirmProgress();
      commitAffirmation();
      return;
    }

    // the whole verse was already spoken once — the only thing left is hearing
    // the last word again as a deliberate confirmation before it counts
    if (pendingConfirm) {
      if (spokenWords.includes(expected[expected.length - 1])) commitAffirmation();
      return;
    }

    const LOOKAHEAD = 6;
    let ei = matchedCount;
    let si = 0;
    while (ei < expected.length && si < spokenWords.length) {
      if (spokenWords[si] === expected[ei]) { ei++; si++; continue; }
      let foundInSpoken = -1;
      for (let k = si + 1; k < Math.min(spokenWords.length, si + LOOKAHEAD); k++) {
        if (spokenWords[k] === expected[ei]) { foundInSpoken = k; break; }
      }
      if (foundInSpoken !== -1) { si = foundInSpoken + 1; ei++; continue; }
      let foundInExpected = -1;
      for (let k = ei + 1; k < Math.min(expected.length, ei + LOOKAHEAD); k++) {
        if (expected[k] === spokenWords[si]) { foundInExpected = k; break; }
      }
      if (foundInExpected !== -1) { ei = foundInExpected + 1; si++; continue; }
      si++;
    }
    matchedCount = ei;
    applyAffirmProgress();
    if (matchedCount >= expected.length) {
      enterPendingConfirm();
      // the repeat may already be sitting right there in this same batch of words
      if (spokenWords.slice(si).includes(expected[expected.length - 1])) commitAffirmation();
    }
  }

  // "Ameen Ameen" (or "Amen Amen") spoken back to back is an alternate way to
  // confirm the verse, instead of repeating its last word
  function hasAmeenAmeen(words) {
    for (let i = 0; i < words.length - 1; i++) {
      if (isAmeen(words[i]) && isAmeen(words[i + 1])) return true;
    }
    return false;
  }
  function isAmeen(w) {
    return w === 'ameen' || w === 'amen' || w === 'aamin' || w === 'amin';
  }

  // verse fully spoken once — hold here glowing the last word until it's said
  // (or tapped) again, so a single read-through doesn't silently count as a tap
  function enterPendingConfirm() {
    if (pendingConfirm) return;
    pendingConfirm = true;
    const spans = verseTextEl.querySelectorAll('.verse-word');
    if (spans.length) spans[spans.length - 1].classList.add('confirm-pending');
    verseHeardEl.textContent = 'say the last word once more to confirm';
  }

  function commitAffirmation() {
    if (awaitingReset) return;
    pendingConfirm = false;
    awaitingReset = true;
    increment();
    playAlertSound();
    showToast('Verse affirmed 🙏');
    // stop listening immediately (not just ignoring results) so no buffered/
    // overlapping recognition event can sneak in and double-trigger this again
    if (recognition) { try { recognition.stop(); } catch (e) {} }
    setTimeout(() => {
      resetAffirmProgress();
      awaitingReset = false;
      if (listening && recognition) { try { recognition.start(); } catch (e) {} }
    }, 900);
  }

  // also used when the user manually taps a word to catch up progress that the
  // speech recognizer missed
  function checkAffirmCompletion() {
    const expected = expectedWords();
    if (expected.length && matchedCount >= expected.length) enterPendingConfirm();
  }

  // clicking a word directly sets progress up to (or back to) that word, for when
  // the recognizer mis-hears or drops a word and the glow needs a manual nudge.
  // tapping the last word again while pending confirms the whole verse.
  function onVerseWordClick(e) {
    const wordEl = e.target.closest('.verse-word');
    if (!wordEl) return;
    e.stopPropagation();
    if (awaitingReset) return;
    const idx = parseInt(wordEl.dataset.widx, 10);
    const expected = expectedWords();
    if (pendingConfirm && idx === expected.length - 1) { commitAffirmation(); return; }
    matchedCount = idx < matchedCount ? idx : idx + 1;
    applyAffirmProgress();
    checkAffirmCompletion();
  }

  // guess a recognition locale from the verse's script since the affirmation
  // has to be spoken in whatever language the saved verse is actually in
  function guessVerseLang() {
    const text = (verseState && verseState.text) || '';
    if (/[ऀ-ॿ]/.test(text)) return 'hi-IN'; // Devanagari (Hindi)
    if (/[؀-ۿ]/.test(text)) return 'ar-SA'; // Arabic
    if (/[一-鿿]/.test(text)) return 'zh-CN'; // CJK
    return navigator.language || 'en-US';
  }

  function createRecognition() {
    const rec = new SpeechRecognitionImpl();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = guessVerseLang();
    rec.onresult = (event) => {
      let words = [];
      let heard = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        heard = transcript;
        words = words.concat(transcript.trim().split(/\s+/).filter(Boolean).map(normalizeWord));
      }
      verseHeardEl.textContent = heard ? `heard: "${heard.trim()}"` : '';
      if (words.length) advanceAffirmation(words);
    };
    rec.onerror = (event) => {
      console.warn('[affirm] recognition error:', event.error);
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        verseHeardEl.textContent = 'mic permission denied';
        stopAffirming();
      } else if (event.error !== 'aborted') {
        verseHeardEl.textContent = `mic error: ${event.error}`;
      }
    };
    rec.onend = () => {
      // if we just confirmed a tap, the deliberate setTimeout in commitAffirmation
      // owns restarting it — don't race that with an immediate auto-restart here
      if (listening && !awaitingReset) {
        try { rec.start(); } catch (e) {}
      }
    };
    return rec;
  }

  function startAffirming() {
    if (!SpeechRecognitionImpl || !(verseState && verseState.text)) return;
    getAudioCtx(); // warm up audio now, on a real click, so the tap sound isn't muted later when a confirm fires from a speech callback
    // never let a previous recognition instance keep running underneath a new
    // one — two live instances both hearing the same speech is what caused
    // "Ameen Ameen" (and other confirms) to double-count
    if (recognition) { recognition.onend = null; try { recognition.stop(); } catch (e) {} }
    listening = true;
    verseMicBtn.classList.add('listening');
    verseHeardEl.textContent = 'listening…';
    resetAffirmProgress();
    recognition = createRecognition();
    try { recognition.start(); } catch (e) {}
  }

  function stopAffirming() {
    listening = false;
    verseMicBtn.classList.remove('listening');
    verseHeardEl.textContent = '';
    if (recognition) { try { recognition.stop(); } catch (e) {} }
    resetAffirmProgress();
  }

  if (!SpeechRecognitionImpl) {
    verseMicBtn.style.display = 'none';
  } else {
    verseMicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (listening) stopAffirming(); else startAffirming();
    });
  }

  verseTextEl.addEventListener('click', onVerseWordClick);

  renderVerse();

  [verseAddBtn, verseEditBtn, verseRemoveBtn, verseSaveBtn, verseCancelBtn, verseForm].forEach((el) => {
    el.addEventListener('click', (e) => e.stopPropagation());
  });
  verseAddBtn.addEventListener('click', openVerseForm);
  verseEditBtn.addEventListener('click', openVerseForm);
  verseRemoveBtn.addEventListener('click', removeVerse);
  verseSaveBtn.addEventListener('click', saveVerse);
  verseCancelBtn.addEventListener('click', closeVerseForm);
  verseFormBackdrop.addEventListener('click', closeVerseForm);

  app.addEventListener('click', increment);

  resetBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    reset();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
      reset();
    }
  });

  function requestFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  window.addEventListener('load', () => {
    requestFullscreen();
  });

  document.addEventListener('click', function once() {
    if (!document.fullscreenElement) requestFullscreen();
  }, { once: false });

  // iOS gates devicemotion behind an explicit permission prompt that can only be
  // triggered from a user gesture — piggyback on the very first tap so the shake
  // gesture (see the devicemotion listener below) works without a visible ask
  document.addEventListener('click', function requestMotionPermissionOnce() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().catch(() => {});
    }
    document.removeEventListener('click', requestMotionPermissionOnce);
  }, { once: true });
</script>

<script type="module">
  import * as THREE from 'three';
  import { Water } from 'three/addons/objects/Water.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const canvas = document.getElementById('bg-webgl');
  const godScene = () => window.__godScene || { scene: 'branches', tapPct: 0, progress: 0.82 };
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a12, 0.0016);

  const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 1, 4000);
  camera.position.set(-159, 100, 252);
  camera.lookAt(-145, 50, -57);

  scene.add(new THREE.HemisphereLight(0x9d7bff, 0x08050c, 0.7));
  const sunLight = new THREE.DirectionalLight(0xffdca8, 1.6);
  sunLight.position.set(-260, 120, 0);
  scene.add(sunLight);
  const farLight = new THREE.PointLight(0x67e8f9, 0.9, 900);
  farLight.position.set(260, 80, -230);
  scene.add(farLight);
  const gateLight = new THREE.PointLight(0xffd28a, 1.6, 260);
  gateLight.position.set(-240, 55, 0);
  scene.add(gateLight);

  // a soft environment map gives the glossy stones and pillars real reflections
  // instead of flat, cartoonish shading
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  // ---- river path: winds left (spiritual) to right/far (physical) in world X/Z ----
  const RANGE = 260;
  function pathXZ(u) {
    const x = -RANGE + u * RANGE * 2;
    const z = Math.sin(u * Math.PI * 1.6 + 0.3) * 95 + Math.sin(u * Math.PI * 0.7) * 40 - u * 160;
    return { x, z };
  }
  function pathHalfWidth(u) {
    return 60 + Math.sin(u * 5.5) * 10 - u * 16;
  }
  // a procedurally-painted rock image (not a flat color) gives the terrain real surface detail
  function makeRockTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#0f0a1a';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 2200; i++) {
      const x = Math.random() * 512, y = Math.random() * 512;
      const r = 1 + Math.random() * 5;
      const shade = 10 + Math.random() * 40;
      const tint = Math.random() < 0.5 ? [124, 58, 237] : [255, 200, 90];
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${shade + tint[0] * 0.06}, ${shade + tint[1] * 0.03}, ${shade + tint[2] * 0.05}, ${0.15 + Math.random() * 0.25})`;
      ctx.fill();
    }
    for (let i = 0; i < 60; i++) {
      ctx.strokeStyle = `rgba(0,0,0,${0.2 + Math.random() * 0.2})`;
      ctx.lineWidth = 0.6 + Math.random();
      ctx.beginPath();
      let x = Math.random() * 512, y = Math.random() * 512;
      ctx.moveTo(x, y);
      for (let s = 0; s < 5; s++) {
        x += (Math.random() - 0.5) * 60;
        y += (Math.random() - 0.5) * 60;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(24, 24);
    return tex;
  }
  const rockTexture = makeRockTexture();
  const rockMat = new THREE.MeshStandardMaterial({ map: rockTexture, roughness: 0.92, metalness: 0.08 });

  // dark rocky ground so the river reads as cutting through terrain rather than
  // floating over a hard-edged void, and so the water has something to reflect
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000, 1, 1), rockMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -12; // well below the bank's inner edge (-3) to avoid z-fighting
  scene.add(ground);

  // real riverbank geometry that physically rises out of the water on both sides,
  // instead of the water sitting as a flat rectangle over empty space
  function buildBankGeometry(side) {
    const SEG = 140;
    const positions = [], normals = [], uvs = [];
    const centers = [];
    for (let i = 0; i <= SEG; i++) {
      const u = i / SEG;
      centers.push({ u, ...pathXZ(u), hw: pathHalfWidth(u) });
    }
    for (let i = 0; i <= SEG; i++) {
      const c = centers[i];
      const prev = centers[Math.max(0, i - 1)];
      const next = centers[Math.min(SEG, i + 1)];
      let tx = next.x - prev.x, tz = next.z - prev.z;
      const tl = Math.hypot(tx, tz) || 1;
      tx /= tl; tz /= tl;
      const px = -tz, pz = tx;
      const bankRise = 5 + Math.sin(c.u * 9 + side) * 2.2 + Math.sin(c.u * 3.3) * 1.6;
      const innerR = c.hw - 1; // tuck slightly under the water edge so there's no visible seam
      const outerR = c.hw + 45; // kept narrow relative to curvature so the ribbon can't fold over itself at bends
      positions.push(c.x + px * side * innerR, -3, c.z + pz * side * innerR);
      positions.push(c.x + px * side * outerR, bankRise, c.z + pz * side * outerR);
      normals.push(0, 1, 0, 0, 1, 0);
      uvs.push(c.u * 8, 0, c.u * 8, 3);
    }
    const indices = [];
    for (let i = 0; i < SEG; i++) {
      const a = i * 2, b = i * 2 + 1, cIdx = (i + 1) * 2, d = (i + 1) * 2 + 1;
      indices.push(a, cIdx, b, b, cIdx, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }
  scene.add(new THREE.Mesh(buildBankGeometry(1), rockMat));
  scene.add(new THREE.Mesh(buildBankGeometry(-1), rockMat));

  // a soft, irregular foam texture along both banks — without this the water
  // meets the rock in one hard geometric line, which reads as fake
  function makeFoamTexture() {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 128, 256);
    for (let i = 0; i < 500; i++) {
      const v = Math.random();
      const bias = Math.pow(Math.random(), 1.8); // most blobs cluster near the water edge (v small)
      const y = bias * 256;
      const x = Math.random() * 128;
      const r = 2 + Math.random() * 7;
      const alpha = (1 - bias) * (0.35 + Math.random() * 0.4);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(235, 240, 255, ${alpha})`;
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.flipY = false; // keep v=0 (canvas top, where blobs are biased) mapped to the water-side edge
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.repeat.set(16, 1);
    return tex;
  }
  const foamTexture = makeFoamTexture();

  function buildFoamGeometry(side) {
    const SEG = 140;
    const positions = [], uvs = [];
    const centers = [];
    for (let i = 0; i <= SEG; i++) {
      const u = i / SEG;
      centers.push({ u, ...pathXZ(u), hw: pathHalfWidth(u) });
    }
    for (let i = 0; i <= SEG; i++) {
      const c = centers[i];
      const prev = centers[Math.max(0, i - 1)];
      const next = centers[Math.min(SEG, i + 1)];
      let tx = next.x - prev.x, tz = next.z - prev.z;
      const tl = Math.hypot(tx, tz) || 1;
      tx /= tl; tz /= tl;
      const px = -tz, pz = tx;
      const innerR = c.hw - 6;
      const outerR = c.hw + 16;
      positions.push(c.x + px * side * innerR, 0.4, c.z + pz * side * innerR);
      positions.push(c.x + px * side * outerR, 0.4, c.z + pz * side * outerR);
      uvs.push(c.u * 16, 0, c.u * 16, 1);
    }
    const indices = [];
    for (let i = 0; i < SEG; i++) {
      const a = i * 2, b = i * 2 + 1, cIdx = (i + 1) * 2, d = (i + 1) * 2 + 1;
      indices.push(a, cIdx, b, b, cIdx, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }
  const foamMat = new THREE.MeshBasicMaterial({
    map: foamTexture, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
  scene.add(new THREE.Mesh(buildFoamGeometry(1), foamMat));
  scene.add(new THREE.Mesh(buildFoamGeometry(-1), foamMat));

  function buildRiverGeometry() {
    const SEG = 140;
    const positions = [], normals = [], uvs = [];
    const centers = [];
    for (let i = 0; i <= SEG; i++) {
      const u = i / SEG;
      centers.push({ u, ...pathXZ(u), hw: pathHalfWidth(u) });
    }
    for (let i = 0; i <= SEG; i++) {
      const c = centers[i];
      const prev = centers[Math.max(0, i - 1)];
      const next = centers[Math.min(SEG, i + 1)];
      let tx = next.x - prev.x, tz = next.z - prev.z;
      const tl = Math.hypot(tx, tz) || 1;
      tx /= tl; tz /= tl;
      const px = -tz, pz = tx; // perpendicular in XZ plane
      positions.push(c.x + px * c.hw, 0, c.z + pz * c.hw);
      positions.push(c.x - px * c.hw, 0, c.z - pz * c.hw);
      normals.push(0, 1, 0, 0, 1, 0);
      uvs.push(c.u * 6, 0, c.u * 6, 1);
    }
    const indices = [];
    for (let i = 0; i < SEG; i++) {
      const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
      indices.push(a, c, b, b, c, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    return geo;
  }

  const waterNormals = new THREE.TextureLoader().load(
    'https://threejs.org/examples/textures/waternormals.jpg',
    (tex) => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; }
  );
  const water = new Water(buildRiverGeometry(), {
    textureWidth: 512,
    textureHeight: 512,
    waterNormals,
    sunDirection: sunLight.position.clone().normalize(),
    sunColor: 0xffdca8,
    waterColor: 0x3a2a6e,
    distortionScale: 3.4,
    fog: true,
  });
  water.material.side = THREE.DoubleSide; // guard against winding-order mistakes in the custom ribbon geometry
  scene.add(water);

  // irregular, angular gold nuggets — a jittered icosahedron reads as a real chunky
  // nugget with sharp glinting facets, not a smooth egg or gem
  // IcosahedronGeometry duplicates a vertex at every face corner it touches (so each
  // face can have its own flat normal). Displacing each duplicate by an independent
  // random amount pulls coincident corners apart and tears the mesh open. Hashing the
  // direction instead gives every duplicate of the same corner the identical bump, so
  // the solid stays closed while still reading as an irregular nugget.
  function hashDir(n) {
    const key = Math.round(n.x * 500) * 73856093 ^ Math.round(n.y * 500) * 19349663 ^ Math.round(n.z * 500) * 83492791;
    const h = Math.sin(key) * 43758.5453;
    return h - Math.floor(h);
  }
  function makeNuggetGeometry(size) {
    // subdivision 3 gives ~1280 faces instead of 80 — enough for real facet detail
    // instead of the flat, low-poly "isometric" look a single subdivision produces
    const geo = new THREE.IcosahedronGeometry(size, 3);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    const fineDir = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i));
      const n = v.clone().normalize();
      // two octaves: a coarse overall lump shape plus finer per-facet bumps,
      // so the surface reads as a real nugget rather than a smooth rounded blob
      const coarse = hashDir(n);
      fineDir.copy(n).multiplyScalar(9);
      const fine = hashDir(fineDir);
      const bump = 0.88 + coarse * 0.2 + (fine - 0.5) * 0.09;
      v.copy(n.multiplyScalar(size * bump));
      pos.setXYZ(i, v.x, v.y * 0.82, v.z); // slight overall squash so it rests naturally
    }
    geo.computeVertexNormals();
    return geo;
  }

  // ---- gold nuggets pouring out from the temple and drifting downstream ----
  const stoneGroup = new THREE.Group();
  scene.add(stoneGroup);
  let stones = [];
  let goldSizeMul = 1;
  let riverSpeedMul = 1;

  function buildStones(count) {
    stoneGroup.children.slice().forEach((m) => {
      stoneGroup.remove(m);
      m.geometry.dispose();
      m.material.dispose();
    });
    stones = [];
    for (let i = 0; i < count; i++) {
      // biased toward u≈0 so the visible population reads as emerging from the
      // temple gate and spreading outward, not scattered evenly with no source
      const u = Math.random() * Math.random() * 0.5;
      const size = (3.5 + Math.random() * 8) * goldSizeMul;
      const geo = makeNuggetGeometry(size);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffc040, metalness: 0.92, roughness: 0.22,
        envMapIntensity: 1.8,
        emissive: 0x5a3608, emissiveIntensity: 0.25,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      stoneGroup.add(mesh);
      stones.push({
        mesh, size,
        u,
        // spread across nearly the full width of the river, not a single lane down
        // the middle
        offsetFrac: (Math.random() - 0.5) * 1.7,
        driftSpeed: 0.000034 + Math.random() * 0.00007, // faster current carrying the nuggets
        phase: Math.random() * Math.PI * 2,
        // per-nugget float level: negative sits partly dunked/submerged, positive
        // rides high — so the surface reads as chunky and uneven, not a uniform raft
        floatBase: (Math.random() * 1.3 - 0.5),
        bobAmp: 0.6 + Math.random() * 0.9,
        bobSpeed: 0.6 + Math.random() * 0.8,
      });
    }
  }
  buildStones(72); // more gold generated from the temple

  // ---- temple gate at the spiritual end, simpler marker gate at the physical end ----
  function makeStonePillar(mat, height) {
    const group = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(16, 6, 16), mat);
    base.position.y = 3;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(6, 6.8, height, 12), mat);
    shaft.position.y = 6 + height / 2;
    const capital = new THREE.Mesh(new THREE.BoxGeometry(16, 6, 16), mat);
    capital.position.y = 6 + height + 3;
    group.add(base, shaft, capital);
    return group;
  }

  // only the spiritual end is "God's temple" — the physical end is a plain stone
  // marker with no inner glow, so it never competes with the temple as a second
  // apparent source and the gold's direction stays unambiguous
  function makeTempleGate(color, isTemple) {
    const group = new THREE.Group();
    const scale = isTemple ? 1.25 : 0.85;
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x2a2436, roughness: 0.85, metalness: 0.1 });
    const pillarHeight = 78 * scale;
    const u = isTemple ? 0 : 1;
    const halfWidth = pathHalfWidth(u); // doorway spacing matches the river's actual width here
    const doorHalf = halfWidth * 0.85;

    const pillarL = makeStonePillar(stoneMat, pillarHeight);
    pillarL.position.x = -doorHalf;
    pillarL.scale.setScalar(scale);
    const pillarR = makeStonePillar(stoneMat, pillarHeight);
    pillarR.position.x = doorHalf;
    pillarR.scale.setScalar(scale);
    group.add(pillarL, pillarR);

    // a layered, flat-topped entablature reads as classical temple stonework
    const spanW = doorHalf * 2 + 16 * scale;
    const pediment = new THREE.Mesh(new THREE.BoxGeometry(spanW, 10 * scale, 22 * scale), stoneMat);
    pediment.position.y = pillarHeight + 17 * scale;
    const pedimentCap = new THREE.Mesh(new THREE.BoxGeometry(spanW * 0.83, 8 * scale, 18 * scale), stoneMat);
    pedimentCap.position.y = pillarHeight + 26 * scale;
    group.add(pediment, pedimentCap);

    // a stone platform/threshold so the gate visually stands on solid ground and
    // meets the water at its feet, instead of floating disconnected from both
    const platform = new THREE.Mesh(new THREE.BoxGeometry(spanW + 20 * scale, 4, halfWidth * 2 + 24 * scale), stoneMat);
    platform.position.y = -2;
    group.add(platform);

    let portal = null;
    if (isTemple) {
      const trimMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.1, metalness: 0.5, roughness: 0.3 });
      const trimTop = new THREE.Mesh(new THREE.BoxGeometry(doorHalf * 2 + 8 * scale, 3 * scale, 3 * scale), trimMat);
      trimTop.position.y = pillarHeight + 10 * scale;
      group.add(trimTop);

      // the doorway itself glows like a divine light is pouring through it
      portal = new THREE.Mesh(
        new THREE.PlaneGeometry(doorHalf * 2, pillarHeight + 4 * scale),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
      );
      portal.position.y = (pillarHeight + 10 * scale) / 2 + 2;
      group.add(portal);
    }

    // face the gate along the river's own direction at this point, so its doorway
    // opens directly onto the water instead of standing sideways to it
    const p0 = pathXZ(u);
    const uAhead = isTemple ? u + 0.02 : u - 0.02;
    const pAhead = pathXZ(uAhead);
    group.position.set(p0.x, 1, p0.z);
    group.lookAt(pAhead.x, 1, pAhead.z);
    return { group, portal };
  }
  const spiritGate = makeTempleGate(0xffd28a, true);
  const physGate = makeTempleGate(0x67e8f9, false);
  scene.add(spiritGate.group, physGate.group);
  gateLight.position.set(spiritGate.group.position.x, 55, spiritGate.group.position.z);

  // ---- golden motes drifting downstream ----
  const MOTE_COUNT = 220; // more gold generated pouring from the temple
  const moteGeo = new THREE.BufferGeometry();
  const motePos = new Float32Array(MOTE_COUNT * 3);
  const moteU = new Float32Array(MOTE_COUNT);
  const moteOffset = new Float32Array(MOTE_COUNT);
  const moteSpeed = new Float32Array(MOTE_COUNT);
  for (let i = 0; i < MOTE_COUNT; i++) {
    moteU[i] = Math.random() * Math.random() * 0.6; // biased near the temple so they visibly pour out of it
    moteOffset[i] = (Math.random() - 0.5) * 1.4;
    moteSpeed[i] = 0.0001 + Math.random() * 0.0002; // faster current
  }
  moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
  function moteSprite() {
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.addColorStop(0, 'rgba(255,244,214,1)');
    g.addColorStop(0.4, 'rgba(255,200,90,0.9)');
    g.addColorStop(1, 'rgba(255,200,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 32, 32);
    return new THREE.CanvasTexture(c);
  }
  const moteMat = new THREE.PointsMaterial({
    size: 6, map: moteSprite(), transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true,
  });
  const motes = new THREE.Points(moteGeo, moteMat);
  scene.add(motes);

  function resizeGl() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resizeGl);
  resizeGl();

  // ---- Blender-style orbit camera + debug panel, hidden by default (press C) ----
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(-145, 50, -57);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 20;
  controls.maxDistance = 900;
  controls.screenSpacePanning = true;
  controls.panSpeed = 1.4;
  // explicit Blender-style mapping: left orbits, middle/scroll zooms, right pans —
  // left-drag alone only rotates around the fixed target, which reads as "stuck"
  controls.mouseButtons = {
    LEFT: THREE.MOUSE.ROTATE,
    MIDDLE: THREE.MOUSE.DOLLY,
    RIGHT: THREE.MOUSE.PAN,
  };
  controls.touches = {
    ONE: THREE.TOUCH.ROTATE,
    TWO: THREE.TOUCH.DOLLY_PAN,
  };
  renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
  controls.enabled = false; // only active while the debug panel is open

  const debugPanel = document.getElementById('river-debug');
  const appEl = document.getElementById('app');
  function setDebugVisible(show) {
    debugPanel.classList.toggle('show', show);
    controls.enabled = show;
    canvas.style.pointerEvents = show ? 'auto' : 'none';
    if (appEl) appEl.style.pointerEvents = show ? 'none' : '';
    debugToggleBtn.classList.toggle('active', show);
  }
  const debugToggleBtn = document.getElementById('debug-toggle-btn');
  debugToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setDebugVisible(!debugPanel.classList.contains('show'));
  });
  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'c' && !e.metaKey && !e.ctrlKey) {
      setDebugVisible(!debugPanel.classList.contains('show'));
    }
  });

  // shake the phone to reveal the hidden scene-controls button — there's no
  // keyboard on mobile to press "C" with
  let lastShakeAccel = null;
  let lastShakeTime = 0;
  const SHAKE_THRESHOLD = 18; // m/s² of jerk between samples
  window.addEventListener('devicemotion', (e) => {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x === null) return;
    const now = Date.now();
    if (lastShakeAccel) {
      const delta = Math.abs(a.x - lastShakeAccel.x) + Math.abs(a.y - lastShakeAccel.y) + Math.abs(a.z - lastShakeAccel.z);
      if (delta > SHAKE_THRESHOLD && now - lastShakeTime > 1000) {
        lastShakeTime = now;
        debugToggleBtn.classList.add('revealed');
      }
    }
    lastShakeAccel = { x: a.x, y: a.y, z: a.z };
  });

  const dbgCount = document.getElementById('dbg-count');
  const dbgCountVal = document.getElementById('dbg-count-val');
  const dbgSize = document.getElementById('dbg-size');
  const dbgSizeVal = document.getElementById('dbg-size-val');
  const dbgSpeed = document.getElementById('dbg-speed');
  const dbgSpeedVal = document.getElementById('dbg-speed-val');
  const camInfo = document.getElementById('dbg-cam-info');

  dbgCount.addEventListener('input', () => {
    dbgCountVal.textContent = dbgCount.value;
    buildStones(parseInt(dbgCount.value, 10));
  });
  dbgSize.addEventListener('input', () => {
    goldSizeMul = parseFloat(dbgSize.value);
    dbgSizeVal.textContent = goldSizeMul.toFixed(2) + '×';
    buildStones(parseInt(dbgCount.value, 10));
  });
  dbgSpeed.addEventListener('input', () => {
    riverSpeedMul = parseFloat(dbgSpeed.value);
    dbgSpeedVal.textContent = riverSpeedMul.toFixed(2) + '×';
  });

  let clock = new THREE.Clock();
  function tickGl() {
    requestAnimationFrame(tickGl);
    const gs = godScene();
    if (gs.scene !== 'river') return;

    const dt = prefersReducedMotion ? 0 : Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    const intensity = (1 + gs.tapPct * 0.7) * riverSpeedMul;

    water.material.uniforms['time'].value += dt * 0.8 * intensity;

    // the temple doorway glows brighter as more gold flows from it with taps
    const portalPulse = 0.5 + 0.5 * Math.sin(t * 1.1);
    spiritGate.portal.material.opacity = 0.4 + 0.35 * portalPulse + gs.tapPct * 0.25;
    gateLight.intensity = 1.2 + portalPulse * 0.8 + gs.tapPct * 1.4;

    // stones drift downstream on the surface, bobbing and glowing as they go
    stones.forEach((s) => {
      if (dt > 0) {
        s.u += s.driftSpeed * intensity * 60 * dt;
        if (s.u > 1) s.u -= 1;
      }
      const { x, z } = pathXZ(s.u);
      const hw = pathHalfWidth(s.u);
      const glow = 0.4 + 0.35 * Math.sin(t * (0.8 + s.phase * 0.1) + s.phase);
      s.mesh.material.emissiveIntensity = glow * (1 + gs.tapPct * 0.6);
      s.mesh.position.set(
        x + s.offsetFrac * hw,
        s.size * s.floatBase + Math.sin(t * s.bobSpeed + s.phase) * s.size * s.bobAmp * 0.12,
        z
      );
      s.mesh.rotation.y += dt * 0.15;
    });

    // motes stream from spiritual to physical, looping, brighter/faster with taps
    const positions = moteGeo.attributes.position.array;
    for (let i = 0; i < MOTE_COUNT; i++) {
      if (dt > 0) {
        moteU[i] += moteSpeed[i] * intensity * 60 * dt;
        if (moteU[i] > 1) moteU[i] -= 1;
      }
      const u = moteU[i];
      const { x, z } = pathXZ(u);
      const hw = pathHalfWidth(u);
      positions[i * 3] = x + moteOffset[i] * hw * 0.6;
      positions[i * 3 + 1] = 4 + Math.sin(t * 1.5 + i) * 2;
      positions[i * 3 + 2] = z;
    }
    moteGeo.attributes.position.needsUpdate = true;
    moteMat.opacity = Math.min(1, 0.7 + gs.tapPct * 0.5);

    if (controls.enabled) {
      // user is orbiting manually (debug panel open) — don't fight their input
      controls.update();
      const p = camera.position, tg = controls.target;
      camInfo.textContent =
        `pos: (${p.x.toFixed(0)}, ${p.y.toFixed(0)}, ${p.z.toFixed(0)})\n` +
        `target: (${tg.x.toFixed(0)}, ${tg.y.toFixed(0)}, ${tg.z.toFixed(0)})`;
    } else {
      // two base framings: the usual temple-facing shot, and a dedicated one held
      // while a verse is showing — found via the debug panel and kept until removed
      const base = { x: -159, y: 100, z: 252, tx: -145, ty: 50, tz: -57 };
      const sway = prefersReducedMotion ? 0 : 1;
      camera.position.x = base.x + Math.sin(t * 0.05) * 14 * sway;
      camera.position.y = base.y + Math.sin(t * 0.04) * 6 * sway;
      camera.position.z = base.z;
      camera.lookAt(base.tx, base.ty, base.tz);
    }

    renderer.render(scene, camera);
  }
  tickGl();
</script>
</body>
</html>
