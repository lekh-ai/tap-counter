<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tap Counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 0%, #1c1830 0%, #0a0a12 55%, #050507 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  #app {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    padding: 0 clamp(24px, 6vw, 110px);
    gap: 4vw;
    cursor: pointer;
  }
  #app.has-verse {
    justify-content: center;
    gap: clamp(48px, 7vw, 110px);
  }

  @media (max-width: 860px) {
    #app {
      flex-direction: column;
      justify-content: center;
      gap: 32px;
      padding: 0 24px;
    }
  }

  /* ambient glow blobs */
  #app::before, #app::after {
    content: "";
    position: absolute;
    width: 45vmax; height: 45vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  #app::before {
    background: #7c3aed;
    top: -15vmax; left: -10vmax;
  }
  #app::after {
    background: #06b6d4;
    bottom: -15vmax; right: -10vmax;
  }

  #ring-wrap {
    position: relative;
    width: min(60vmin, 480px);
    height: min(60vmin, 480px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  #ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  #ring circle {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
  }

  #ring .track {
    stroke: rgba(255,255,255,0.08);
  }

  #ring .progress {
    stroke: url(#grad);
    stroke-dasharray: 1256;
    stroke-dashoffset: 1256;
    transition: stroke-dashoffset 0.25s ease;
  }

  #core {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 0 60px rgba(124, 58, 237, 0.15), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  #count {
    font-size: 16vw;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: transform 0.08s ease;
  }

  #count.pulse {
    transform: scale(1.1);
  }

  #hint {
    margin-top: 10px;
    font-size: clamp(12px, 1.6vmin, 15px);
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 600;
  }

  #phase {
    margin-top: 6px;
    font-size: clamp(11px, 1.4vmin, 13px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 700;
    background: linear-gradient(135deg, #c4b5fd, #67e8f9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #phase.show {
    opacity: 1;
    transform: translateY(0);
  }

  #scene-toggle {
    position: fixed;
    top: 24px;
    left: 24px;
    display: flex;
    gap: 4px;
    padding: 4px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    z-index: 10;
  }

  #scene-toggle button {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.5);
    background: transparent;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  #scene-toggle button.active {
    color: #fff;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
  }

  #scene-toggle button:not(.active):hover {
    color: rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.08);
  }

  #volume {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    z-index: 10;
  }

  #volume svg {
    width: 16px;
    height: 16px;
    color: rgba(255,255,255,0.55);
    flex-shrink: 0;
  }

  #volume input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 90px;
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(to right, #7c3aed, #06b6d4);
    cursor: pointer;
  }

  #volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(196, 181, 253, 0.9);
    cursor: pointer;
  }

  #volume input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(196, 181, 253, 0.9);
    cursor: pointer;
  }

  #reset {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }

  #reset:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
  }

  #reset:active {
    transform: translateX(-50%) scale(0.96);
  }

  #reset kbd {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 12px;
    font-family: inherit;
  }

  #verse-panel {
    position: relative;
    z-index: 1;
    max-width: min(38vw, 480px);
    max-height: calc(100vh - 300px);
    display: none;
    flex-direction: column;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.6s ease, transform 0.6s ease, background 0.2s ease;
    padding: 28px 32px;
    border-radius: 20px;
    background: rgba(15, 12, 24, 0.55);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  #verse-scroll {
    overflow-y: auto;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: rgba(196, 181, 253, 0.4) transparent;
  }
  #verse-scroll::-webkit-scrollbar { width: 6px; }
  #verse-scroll::-webkit-scrollbar-thumb {
    background: rgba(196, 181, 253, 0.4);
    border-radius: 999px;
  }
  #verse-panel.show {
    display: flex;
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 860px) {
    #verse-panel {
      max-width: 90vw;
    }
  }

  #verse-text {
    font-size: clamp(17px, 2.6vmin, 26px);
    font-weight: 600;
    line-height: 1.45;
    color: rgba(255,255,255,0.92);
    font-style: italic;
  }

  .verse-list {
    margin: 0;
    padding-left: 1.2em;
    list-style: none;
  }
  .verse-list li {
    position: relative;
    margin: 4px 0;
  }
  .verse-list li::before {
    content: '•';
    position: absolute;
    left: -1.1em;
    color: rgba(196, 181, 253, 0.85);
    font-style: normal;
  }

  #verse-ref {
    margin-top: 16px;
    font-size: clamp(12px, 1.5vmin, 14px);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: rgba(196, 181, 253, 0.85);
  }

  #verse-actions {
    margin-top: 18px;
    display: flex;
    gap: 10px;
  }
  @media (max-width: 860px) {
    #verse-actions { justify-content: center; }
  }
  #verse-actions button {
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #verse-actions button:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }
  #verse-mic-btn.listening {
    background: rgba(124, 58, 237, 0.35);
    border-color: rgba(196, 181, 253, 0.6);
    color: #fff;
  }
  .verse-word {
    transition: color 0.25s ease, text-shadow 0.25s ease;
    cursor: pointer;
    border-radius: 3px;
  }
  .verse-word:hover {
    background: rgba(255,255,255,0.08);
  }
  .verse-word.said {
    color: #fff;
    text-shadow: 0 0 10px rgba(196, 181, 253, 0.95), 0 0 22px rgba(124, 58, 237, 0.8);
  }
  .verse-word.confirm-pending {
    animation: confirmPulse 1s ease-in-out infinite;
  }
  @keyframes confirmPulse {
    0%, 100% { text-shadow: 0 0 10px rgba(196, 181, 253, 0.95), 0 0 22px rgba(124, 58, 237, 0.8); }
    50% { text-shadow: 0 0 4px rgba(196, 181, 253, 0.4); }
  }
  #verse-heard {
    margin-top: 10px;
    font-size: 11px;
    font-style: normal;
    color: rgba(255,255,255,0.4);
    min-height: 14px;
  }

  #verse-add-btn {
    position: fixed;
    bottom: 40px;
    right: 24px;
    z-index: 10;
    padding: 12px 22px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.05);
    border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  #verse-add-btn:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }

  #verse-form {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 40;
    display: none;
    width: min(38vw, 480px);
    padding: 20px;
    background: rgba(15, 12, 24, 0.92);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #verse-form.show { display: block; }
  #verse-form-backdrop {
    position: fixed;
    inset: 0;
    z-index: 35;
    background: rgba(0,0,0,0.5);
    display: none;
  }
  #verse-form-backdrop.show { display: block; }
  @media (max-width: 860px) {
    #verse-form { width: 90vw; }
  }
  #verse-form textarea,
  #verse-form input {
    width: 100%;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    color: #fff;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    resize: vertical;
    outline: none;
  }
  #verse-form textarea:focus,
  #verse-form input:focus {
    border-color: rgba(196, 181, 253, 0.6);
  }
  #verse-form input { margin-top: 10px; }
  #verse-form .verse-form-actions {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }
  #verse-form .verse-form-actions button {
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    border: none;
  }
  #verse-save-btn {
    color: #fff;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
  }
  #verse-cancel-btn {
    color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.08);
  }

  #toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    padding: 16px 28px;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    border-radius: 14px;
    font-weight: 700;
    font-size: clamp(14px, 2vmin, 18px);
    box-shadow: 0 10px 40px rgba(124, 58, 237, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 20;
    white-space: nowrap;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #titles {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    text-align: center;
    width: 90vw;
    max-width: 700px;
    pointer-events: none;
  }

  #title {
    font-size: clamp(32px, 6vmin, 56px);
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #fff 0%, #c4b5fd 50%, #7c3aed 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(124, 58, 237, 0.5);
  }

  #subtitle {
    margin-top: 10px;
    font-size: clamp(12px, 1.8vmin, 16px);
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.01em;
  }

  /* realms */
  .realm {
    position: fixed;
    top: 0; bottom: 0;
    width: min(14vw, 140px);
    z-index: 0;
    pointer-events: none;
  }
  .realm.spiritual {
    left: 0;
    background: linear-gradient(to right, rgba(124,58,237,0.28), transparent);
  }
  .realm.physical {
    right: 0;
    background: linear-gradient(to left, rgba(6,182,212,0.22), transparent);
  }
  .realm span {
    position: absolute;
    top: 50%; left: 50%;
    writing-mode: vertical-rl;
    transform: translate(-50%, -50%);
    text-transform: uppercase;
    letter-spacing: 0.3em;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.3);
  }

  /* root/ember background */
  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  /* WebGL river scene */
  #bg-webgl {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    display: none;
  }

  /* river debug panel — hidden by default, toggled with the C key */
  #debug-toggle-btn {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    cursor: pointer;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: background 0.15s ease, color 0.15s ease, opacity 0.4s ease;
  }
  /* hidden until a shake gesture reveals it (see the devicemotion listener) —
     desktop doesn't need it since the C key opens the panel directly */
  #debug-toggle-btn.revealed {
    opacity: 1;
    pointer-events: auto;
  }
  #debug-toggle-btn:hover, #debug-toggle-btn.active {
    color: #fff;
    background: rgba(255,255,255,0.12);
  }

  #river-debug {
    position: fixed;
    top: 90px;
    right: 24px;
    width: 240px;
    padding: 16px 18px;
    background: rgba(15, 12, 24, 0.82);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    z-index: 30;
    display: none;
    color: #fff;
    font-size: 12px;
  }
  #river-debug.show { display: block; }
  #river-debug h4 {
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    font-weight: 700;
  }
  #river-debug label {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    margin-bottom: 4px;
    color: rgba(255,255,255,0.75);
    font-weight: 600;
  }
  #river-debug label span:last-child {
    color: rgba(196, 181, 253, 0.9);
    font-weight: 700;
  }
  #river-debug input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(to right, #7c3aed, #06b6d4);
    cursor: pointer;
  }
  #river-debug input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(196, 181, 253, 0.9);
    cursor: pointer;
  }
  #river-debug input[type="color"] {
    width: 100%;
    height: 30px;
    padding: 2px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    cursor: pointer;
  }
  #river-debug select {
    width: 100%;
    padding: 8px 10px;
    font-size: 12px;
    font-family: inherit;
    color: #fff;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    cursor: pointer;
  }
  #river-debug .hint {
    margin-top: 14px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    line-height: 1.5;
  }

  /* floating cosmic / angelic symbols */
  #symbols {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .symbol {
    position: absolute;
    filter: drop-shadow(0 0 6px currentColor);
    animation: symbol-float ease-in-out infinite;
    will-change: transform, opacity;
  }
  .symbol svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .symbol.spirit { color: rgba(196, 181, 253, 0.55); }
  .symbol.phys { color: rgba(103, 232, 249, 0.5); }

  @keyframes symbol-float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-16px) rotate(4deg); }
  }

  @media (max-width: 860px) {
    /* mobile relies on flex-centering the ring/verse-panel group, which gives no
       guaranteed clearance for the fixed top toolbar, the absolutely-positioned
       title, or the fixed Reset button — so on a tall verse it all collided.
       Switch to a normal top-to-bottom scroll with reserved space at both ends
       instead of forcing everything into one centered, unscrollable screen.
       (Placed at the end of the stylesheet so these overrides actually win the
       cascade against the later plain-selector base rules above.) */
    #app, #app.has-verse {
      justify-content: flex-start;
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
      padding-top: 168px;
      padding-bottom: 120px;
      gap: 24px;
    }

    /* the top toggle/volume pills are fixed at top:24px and were overlapping
       the title, which sat right above the ring at the same height */
    #scene-toggle, #volume {
      top: 14px;
      padding: 3px;
    }
    #scene-toggle button {
      padding: 6px 12px;
      font-size: 12px;
    }
    #volume {
      padding: 8px 12px;
      gap: 6px;
    }
    #volume input[type="range"] {
      width: 60px;
    }
    #titles {
      top: 76px;
      width: 94vw;
    }
    #title {
      font-size: clamp(22px, 8vw, 40px);
    }
    #subtitle {
      font-size: clamp(10px, 3vw, 13px);
    }
    #ring-wrap {
      width: min(58vw, 300px);
      height: min(58vw, 300px);
      flex-shrink: 0;
    }
    #verse-panel {
      /* kept well clear of the fixed Reset pill at the bottom — long verses
         scroll inside the panel itself (#verse-scroll) rather than pushing the
         panel's bottom edge under Reset */
      max-height: 34vh;
      margin-bottom: 90px;
    }
    #river-debug {
      top: auto;
      bottom: 68px;
      left: 24px;
      right: 24px;
      width: auto;
      max-height: 60vh;
      overflow-y: auto;
    }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="realm spiritual"><span>Spiritual</span></div>
<div class="realm physical"><span>Physical</span></div>
<canvas id="bg-canvas"></canvas>
<canvas id="bg-webgl"></canvas>
<button type="button" id="debug-toggle-btn" title="Scene controls" aria-label="Scene controls">⚙</button>
<div id="river-debug">
  <h4>Scene Controls</h4>
  <div id="verse-ctrl-group">
    <label><span>Verse box opacity</span><span id="dbg-verse-opacity-val">55%</span></label>
    <input type="range" id="dbg-verse-opacity" min="0" max="100" step="5" value="55">
    <label><span>Verse font size</span><span id="dbg-verse-size-val">20px</span></label>
    <input type="range" id="dbg-verse-size" min="12" max="40" step="1" value="20">
    <label><span>Verse font color</span><span></span></label>
    <input type="color" id="dbg-verse-color" value="#ebe6ff">
    <label style="margin-top:12px;"><span>Verse font</span><span></span></label>
    <select id="dbg-verse-font">
      <option value="inherit">Default</option>
      <option value="Georgia, 'Times New Roman', serif">Serif</option>
      <option value="'Courier New', monospace">Monospace</option>
      <option value="'Brush Script MT', cursive">Cursive</option>
      <option value="'Trebuchet MS', sans-serif">Rounded</option>
    </select>
  </div>
  <div id="river-ctrl-group">
    <label><span>Gold count</span><span id="dbg-count-val">72</span></label>
    <input type="range" id="dbg-count" min="10" max="200" step="1" value="72">
    <label><span>Gold size</span><span id="dbg-size-val">1.0×</span></label>
    <input type="range" id="dbg-size" min="0.3" max="2.5" step="0.05" value="1">
    <label><span>River speed</span><span id="dbg-speed-val">1.0×</span></label>
    <input type="range" id="dbg-speed" min="0" max="4" step="0.05" value="1">
    <div class="hint">Left-drag: orbit · Right-drag: pan<br>Scroll: zoom · Press C or tap ⚙ to hide</div>
    <div id="dbg-cam-info" class="hint" style="margin-top:10px; color:rgba(196,181,253,0.9); font-family:monospace; white-space:pre-line;"></div>
  </div>
  <div id="branches-ctrl-group" style="display:none;">
    <label><span>Branch density</span><span id="dbg-density-val">1.0×</span></label>
    <input type="range" id="dbg-density" min="0.2" max="2.5" step="0.1" value="1">
    <label><span>Wind turbulence</span><span id="dbg-wind-val">1.0×</span></label>
    <input type="range" id="dbg-wind" min="0" max="3" step="0.1" value="1">
    <label><span>Branch thickness</span><span id="dbg-thickness-val">1.0×</span></label>
    <input type="range" id="dbg-thickness" min="0.3" max="2.5" step="0.1" value="1">
    <div class="hint">Press C or tap ⚙ to hide</div>
  </div>
</div>
<div id="symbols"></div>
<div id="app">
  <div id="titles">
    <div id="title">The God Challenge</div>
    <div id="subtitle">Imagining, Musing, Muttering &rarr; Manifesting to Natural from Spiritual</div>
  </div>
  <div id="ring-wrap">
    <svg id="ring" viewBox="0 0 420 420">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed"/>
          <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="210" cy="210" r="200"/>
      <circle class="progress" cx="210" cy="210" r="200"/>
    </svg>
    <div id="core">
      <div id="count">0</div>
      <div id="hint">tap anywhere</div>
      <div id="phase"></div>
    </div>
  </div>
  <div id="verse-panel">
    <div id="verse-scroll">
      <div id="verse-text"></div>
      <div id="verse-ref"></div>
    </div>
    <div id="verse-actions">
      <button type="button" id="verse-mic-btn">🎙 Affirm</button>
      <button type="button" id="verse-edit-btn">Edit</button>
      <button type="button" id="verse-remove-btn">Remove</button>
    </div>
    <div id="verse-heard"></div>
  </div>
</div>

<button type="button" id="verse-add-btn">+ Add verse</button>
<div id="verse-form-backdrop"></div>
<div id="verse-form">
  <textarea id="verse-input" rows="4" placeholder="Enter a verse..."></textarea>
  <input type="text" id="verse-ref-input" placeholder="Reference (e.g. John 3:16)">
  <div class="verse-form-actions">
    <button type="button" id="verse-save-btn">Save</button>
    <button type="button" id="verse-cancel-btn">Cancel</button>
  </div>
</div>

<div id="toast">🎉 100 taps reached!</div>
<div id="scene-toggle">
  <button type="button" data-scene="branches">Branches</button>
  <button type="button" data-scene="river">River</button>
</div>
<button id="reset">Reset <kbd>R</kbd></button>
<div id="volume">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="4 9 8 9 12 5 12 19 8 15 4 15" fill="currentColor" stroke="none"/>
    <path d="M16 8a5 5 0 0 1 0 8"/>
    <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
  </svg>
  <input type="range" id="volume-slider" min="0" max="200" value="70" aria-label="Effect volume">
</div>

<script>
  const STORAGE_KEY = 'god-challenge-count';
  let count = 0;
  try {
    const saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (Number.isFinite(saved) && saved >= 0) count = Math.min(saved, 100);
  } catch (e) {}

  const countEl = document.getElementById('count');
  const app = document.getElementById('app');
  const resetBtn = document.getElementById('reset');
  const progressEl = document.querySelector('#ring .progress');
  const toastEl = document.getElementById('toast');
  const phaseEl = document.getElementById('phase');
  const CIRC = 1256; // 2 * PI * 200, matches stroke-dasharray

  const PHASES = [
    { max: 25, label: 'Imagining' },
    { max: 50, label: 'Musing' },
    { max: 75, label: 'Muttering' },
    { max: 100, label: 'Manifesting' },
  ];
  function phaseForCount(c) {
    return PHASES.find((p) => c <= p.max) || PHASES[PHASES.length - 1];
  }
  let lastPhaseLabel = null;
  function updatePhase() {
    const phase = phaseForCount(count);
    if (phase.label !== lastPhaseLabel) {
      lastPhaseLabel = phase.label;
      phaseEl.textContent = phase.label;
      phaseEl.classList.remove('show');
      void phaseEl.offsetWidth;
      phaseEl.classList.add('show');
    }
  }

  const MILESTONES = {
    25: 'Imagining takes root 🌱',
    50: 'Musing deepens the current 🌊',
    75: 'Muttering becomes conviction 🔥',
    100: '🎉 Manifesting — 100 taps reached!',
  };
  const VOLUME_KEY = 'god-challenge-volume';
  const volumeSlider = document.getElementById('volume-slider');
  let effectVolume = 0.7;
  try {
    const savedVol = parseInt(localStorage.getItem(VOLUME_KEY), 10);
    if (Number.isFinite(savedVol) && savedVol >= 0 && savedVol <= 200) effectVolume = savedVol / 100;
  } catch (e) {}
  volumeSlider.value = Math.round(effectVolume * 100);

  let audioCtx = null;
  let masterGain = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = effectVolume;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  volumeSlider.addEventListener('input', () => {
    effectVolume = volumeSlider.value / 100;
    if (masterGain) masterGain.gain.value = effectVolume;
    try { localStorage.setItem(VOLUME_KEY, volumeSlider.value); } catch (e) {}
  });

  function updateDisplay() {
    countEl.textContent = count;
    countEl.classList.remove('pulse');
    void countEl.offsetWidth;
    countEl.classList.add('pulse');

    const pct = Math.min(count / 100, 1);
    progressEl.style.strokeDashoffset = CIRC * (1 - pct);
    setRootProgress(pct);
    updatePhase();

    try { localStorage.setItem(STORAGE_KEY, String(count)); } catch (e) {}
  }

  // ---- Root / ember background engine (canvas) ----
  const canvas = document.getElementById('bg-canvas');
  const bctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Floating cosmic / angelic background symbols (line-art SVG, no emoji) ----
  const SPIRIT_ICONS = [
    // dove / wing
    '<svg viewBox="0 0 24 24"><path d="M2 13c3-3 6-1 8 1 1-4 4-7 8-7-1 3-3 5-3 5s3 0 5 2c-4 1-7 0-9-1-1 2-3 4-6 4 1-1 1-2 1-3-2 1-3 0-4-1z"/></svg>',
    // feather
    '<svg viewBox="0 0 24 24"><path d="M18 3c-6 1-11 6-12 12l-2 6 6-2C16 17 21 12 22 6l-4 4M13 8l-4 4M15 11l-4 4"/></svg>',
    // halo ring
    '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7" ry="2.4"/><path d="M12 9v11M9 15h6"/></svg>',
    // radiant star
    '<svg viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M5.6 5.6l3 3M15.4 15.4l3 3M18.4 5.6l-3 3M8.6 15.4l-3 3"/></svg>',
    // sparkle
    '<svg viewBox="0 0 24 24"><path d="M12 3c0 4 2 6 6 6-4 0-6 2-6 6 0-4-2-6-6-6 4 0 6-2 6-6z"/></svg>',
  ];
  const PHYS_ICONS = [
    // ringed planet
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="3" transform="rotate(-20 12 12)"/></svg>',
    // crescent moon
    '<svg viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 0 18 7 7 0 1 1 0-18z"/></svg>',
    // simple star
    '<svg viewBox="0 0 24 24"><path d="M12 4l2.2 5.6L20 11l-4.6 3.6L16.5 20 12 16.8 7.5 20l1.1-5.4L4 11l5.8-1.4z"/></svg>',
    // orbit / galaxy swirl
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(15 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-35 12 12)"/></svg>',
    // leaf
    '<svg viewBox="0 0 24 24"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16z"/><path d="M5 19c3-5 7-9 12-11"/></svg>',
  ];

  function initSymbols() {
    const container = document.getElementById('symbols');
    const total = 16;
    for (let i = 0; i < total; i++) {
      const isSpirit = i % 2 === 0;
      const icons = isSpirit ? SPIRIT_ICONS : PHYS_ICONS;
      const el = document.createElement('div');
      el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
      el.className = `symbol ${isSpirit ? 'spirit' : 'phys'}`;
      const leftPct = isSpirit ? Math.random() * 30 : 70 + Math.random() * 30;
      const size = 16 + Math.random() * 22;
      el.style.left = `${leftPct}%`;
      el.style.top = `${8 + Math.random() * 78}%`;
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      el.style.opacity = (0.25 + Math.random() * 0.35).toFixed(2);
      if (!reducedMotion) {
        el.style.animationDuration = `${8 + Math.random() * 10}s`;
        el.style.animationDelay = `${-Math.random() * 10}s`;
      } else {
        el.style.animation = 'none';
      }
      container.appendChild(el);
    }
  }
  initSymbols();

  let W = 0, H = 0;
  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }

  // ---- Scene toggle: "branches" (root network) vs "river" (temple river) ----
  const SCENE_KEY = 'god-challenge-scene';
  let currentScene = 'branches';
  try {
    const savedScene = localStorage.getItem(SCENE_KEY);
    if (savedScene === 'branches' || savedScene === 'river') currentScene = savedScene;
  } catch (e) {}

  const spiritColor = [124, 58, 237];
  const physColor = [6, 182, 212];
  function gradientColorAt(t, alpha) {
    const c = t < 0.6
      ? spiritColor
      : [
          lerp(spiritColor[0], physColor[0], (t - 0.6) / 0.4),
          lerp(spiritColor[1], physColor[1], (t - 0.6) / 0.4),
          lerp(spiritColor[2], physColor[2], (t - 0.6) / 0.4),
        ];
    return `rgba(${c[0] | 0}, ${c[1] | 0}, ${c[2] | 0}, ${alpha})`;
  }
  const rootColorAt = gradientColorAt;

  // ---- Scene: branches (root network with leaves) ----
  // wave constants — each depth has its own frequency, but a child always inherits
  // its parent's live offset at the exact attachment point so joins never separate.
  const TRUNK_FREQ = 0.0005, BRANCH_FREQ = 0.0011, CHILD_FREQ = 0.0014;
  const TRUNK_WAVE_AMP = 0.006, BRANCH_WAVE_AMP = 0.014, CHILD_WAVE_AMP = 0.018;

  // build a jagged organic polyline of normalized points (x,y in 0..1)
  function buildPolyline(x0, y0, x1, y1, segments, wobble) {
    const pts = [{ x: x0, y: y0 }];
    for (let i = 1; i < segments; i++) {
      const t = i / segments;
      const bow = Math.sin(t * Math.PI) * wobble * 0.6;
      pts.push({
        x: lerp(x0, x1, t),
        y: lerp(y0, y1, t) + (Math.random() - 0.5) * wobble + bow * (Math.random() - 0.5),
      });
    }
    pts.push({ x: x1, y: y1 });
    return pts;
  }

  function makeBranch(parentPts, depth, opts) {
    opts = opts || {};
    const idxMax = opts.idxMax || (parentPts.length - 2);
    const idx = 1 + Math.floor(Math.random() * Math.max(1, Math.min(idxMax, parentPts.length - 2)));
    const parentT = idx / (parentPts.length - 1);
    const start = parentPts[idx];
    const dir = Math.random() < 0.5 ? -1 : 1;
    const spanX = rand(0.06, 0.16) * (depth === 1 ? 1 : 0.6);
    const spanY = dir * rand(0.03, 0.09);
    const endX = Math.min(0.94, start.x + spanX);
    const endY = clamp01(start.y + spanY);
    const pts = buildPolyline(start.x, start.y, endX, endY, 4, 0.02);
    const branch = {
      pts,
      parentT,
      phase: rand(0, Math.PI * 2),
      appearAt: opts.appearMax != null ? rand(0, opts.appearMax) : rand(0.02, depth === 1 ? 0.55 : 0.75),
      growthSpeed: rand(0.8, 1.4),
      baseWidth: depth === 1 ? rand(1.1, 1.9) : rand(0.5, 0.9),
      alpha: depth === 1 ? rand(0.55, 0.8) : rand(0.35, 0.55),
      hasLeaf: Math.random() < 0.92,
      children: [],
    };
    if (depth === 1 && Math.random() < 0.8) {
      branch.children.push(makeBranch(pts, 2));
      if (Math.random() < 0.4) branch.children.push(makeBranch(pts, 2));
    }
    return branch;
  }

  // live-adjustable via the debug panel (C) — persist across panel/scene toggles
  // since they're just plain variables, never reset except by the user
  let branchDensityMul = 1;
  let windMul = 1;
  let thicknessMul = 1;

  function buildTrunks(count) {
    const trunks = [];
    for (let i = 0; i < count; i++) {
      const y = 0.1 + (i * (0.8 / (count - 1))) + rand(-0.02, 0.02);
      const endY = clamp01(y + rand(-0.05, 0.05));
      const pts = buildPolyline(0, y, 0.9, endY, 12, 0.035);
      const trunk = {
        pts,
        growthSpeed: rand(0.85, 1.2),
        baseWidth: rand(2.6, 4.2),
        tipWidth: rand(0.35, 0.6),
        phase: rand(0, Math.PI * 2),
        branches: [],
      };
      const branchCount = Math.round((4 + Math.floor(Math.random() * 4)) * branchDensityMul);
      for (let b = 0; b < branchCount; b++) trunk.branches.push(makeBranch(pts, 1));

      // extra branches clustered near the spiritual origin, visible from the start,
      // so the root network reads noticeably denser on that side by default
      const denseCount = Math.round((5 + Math.floor(Math.random() * 3)) * branchDensityMul);
      const idxMax = Math.max(2, Math.floor((pts.length - 2) * 0.35));
      for (let d = 0; d < denseCount; d++) {
        trunk.branches.push(makeBranch(pts, 1, { idxMax, appearMax: 0.08 }));
      }

      trunks.push(trunk);
    }
    return trunks;
  }

  let trunks = buildTrunks(6);

  function trunkWaveAt(trunk, t, time) {
    return TRUNK_WAVE_AMP * windMul * t * Math.sin(time * TRUNK_FREQ + trunk.phase);
  }
  function branchWaveAt(trunk, branch, s, time) {
    return trunkWaveAt(trunk, branch.parentT, time) + BRANCH_WAVE_AMP * windMul * s * Math.sin(time * BRANCH_FREQ + branch.phase);
  }
  function childWaveAt(trunk, branch, child, u, time) {
    return branchWaveAt(trunk, branch, child.parentT, time) + CHILD_WAVE_AMP * windMul * u * Math.sin(time * CHILD_FREQ + child.phase);
  }

  // point along a polyline at normalized reveal fraction t (0..1); waveFn(t, time) supplies extra y-offset
  function pointAt(pts, t, waveFn, time) {
    const total = pts.length - 1;
    const f = clamp01(t) * total;
    const i = Math.min(Math.floor(f), total - 1);
    const local = f - i;
    const a = pts[i], b = pts[Math.min(i + 1, total)];
    const x = lerp(a.x, b.x, local);
    let y = lerp(a.y, b.y, local);
    if (waveFn && !reducedMotion) y += waveFn(t, time);
    return { x, y };
  }

  function strokeGrowingLine(pts, reveal, widthStart, widthEnd, alpha, time, waveFn, colorStops) {
    if (reveal <= 0) return null;
    const steps = Math.max(2, Math.round((pts.length - 1) * clamp01(reveal)) + 1);
    let prev = pointAt(pts, 0, waveFn, time);
    let tip = prev;
    for (let s = 1; s <= steps; s++) {
      const localT = Math.min(1, s / (pts.length - 1));
      const revealT = Math.min(localT, reveal);
      const cur = pointAt(pts, revealT, waveFn, time);
      const segT = revealT;
      const w = lerp(widthStart, widthEnd, segT);
      bctx.beginPath();
      bctx.moveTo(prev.x * W, prev.y * H);
      bctx.lineTo(cur.x * W, cur.y * H);
      bctx.lineWidth = w;
      bctx.strokeStyle = colorStops(segT, alpha);
      bctx.stroke();
      tip = cur;
      prev = cur;
      if (revealT >= reveal) break;
    }
    return tip;
  }

  function drawLeaf(p, angle, size, color, alpha) {
    bctx.save();
    bctx.translate(p.x * W, p.y * H);
    bctx.rotate(angle);
    bctx.globalAlpha = alpha;

    // stem — drawn back along the branch's own direction so the leaf
    // always reads as attached, even when the branch stroke itself is thin/faint
    bctx.beginPath();
    bctx.moveTo(-size * 0.9, 0);
    bctx.lineTo(0, 0);
    bctx.strokeStyle = color;
    bctx.lineWidth = Math.max(1, size * 0.16);
    bctx.lineCap = 'round';
    bctx.stroke();

    bctx.shadowColor = color;
    bctx.shadowBlur = size * 0.6;
    bctx.beginPath();
    bctx.moveTo(0, 0);
    bctx.quadraticCurveTo(size * 0.55, -size * 0.55, size * 1.4, 0);
    bctx.quadraticCurveTo(size * 0.55, size * 0.55, 0, 0);
    bctx.fillStyle = color;
    bctx.fill();
    bctx.shadowBlur = 0;
    bctx.beginPath();
    bctx.moveTo(0, 0);
    bctx.lineTo(size * 1.3, 0);
    bctx.strokeStyle = 'rgba(255,255,255,0.5)';
    bctx.lineWidth = Math.max(0.6, size * 0.08);
    bctx.stroke();
    bctx.restore();
  }

  // ember particles: ambient drifters + a few that ride along trunks toward the physical side
  const BR_EMBER_BASE = 26;
  const BR_EMBER_MAX_EXTRA = 20;
  const brEmbers = [];
  for (let i = 0; i < BR_EMBER_BASE + BR_EMBER_MAX_EXTRA; i++) {
    brEmbers.push({
      x: Math.random(), y: Math.random(),
      vx: rand(0.00006, 0.00016),
      vy: rand(-0.00004, 0.00004),
      size: rand(0.8, 2.2),
      baseAlpha: rand(0.15, 0.4),
      phase: rand(0, Math.PI * 2),
    });
  }
  function makeFlowEmber(path, growthSpeedOwner, appearAt) {
    return {
      path,
      appearAt: appearAt || 0,
      growthSpeedOwner,
      t: Math.random(),
      speed: rand(0.00009, 0.0002),
      size: rand(1.4, 2.4),
    };
  }

  let brFlowEmbers = [];
  function rebuildFlowEmbers() {
    brFlowEmbers = [];
    trunks.forEach((trunk) => {
      brFlowEmbers.push(makeFlowEmber(trunk.pts, trunk, 0));
      trunk.branches.forEach((branch) => {
        brFlowEmbers.push(makeFlowEmber(branch.pts, trunk, branch.appearAt));
        branch.children.forEach((child) => {
          brFlowEmbers.push(makeFlowEmber(child.pts, trunk, child.appearAt));
        });
      });
    });
  }
  rebuildFlowEmbers();

  // called when the branch density slider changes — regenerates the whole
  // network since branch count is baked in at construction time
  function regenerateBranches() {
    trunks = buildTrunks(6);
    rebuildFlowEmbers();
  }

  function renderBranches(time) {
    // roots
    trunks.forEach((trunk) => {
      const reveal = clamp01(progress * trunk.growthSpeed * 1.15);
      if (reveal <= 0) return;
      const widthScale = (0.35 + 0.65 * progress) * thicknessMul;
      strokeGrowingLine(
        trunk.pts, reveal,
        trunk.baseWidth * widthScale, trunk.tipWidth * widthScale,
        0.8, time, (t, tm) => trunkWaveAt(trunk, t, tm),
        (t, a) => rootColorAt(t, a * (1 - t * 0.5))
      );

      trunk.branches.forEach((branch) => {
        if (progress < branch.appearAt) return;
        const bReveal = clamp01(((progress - branch.appearAt) / Math.max(0.01, 1 - branch.appearAt)) * branch.growthSpeed * 1.3);
        if (bReveal <= 0) return;
        strokeGrowingLine(
          branch.pts, bReveal,
          branch.baseWidth * widthScale, branch.baseWidth * widthScale * 0.15,
          branch.alpha, time, (s, tm) => branchWaveAt(trunk, branch, s, tm),
          (t, a) => rootColorAt(branch.pts[0].x + t * 0.1, a * (1 - bReveal * 0.3) * (1 - t))
        );
        if (branch.hasLeaf && bReveal > 0.55) {
          const last = branch.pts[branch.pts.length - 1];
          const prevPt = branch.pts[branch.pts.length - 2];
          const angle = Math.atan2((last.y - prevPt.y) * H, (last.x - prevPt.x) * W);
          const tipPt = pointAt(branch.pts, bReveal, (s, tm) => branchWaveAt(trunk, branch, s, tm), time);
          const leafSize = (6 + branch.baseWidth * 2.2) * Math.max(widthScale, 0.7);
          const leafAlpha = Math.min(1, (bReveal - 0.55) / 0.3) * Math.max(branch.alpha, 0.75);
          drawLeaf(tipPt, angle, leafSize, rootColorAt(branch.pts[0].x + 0.05, 1), leafAlpha);
        }
        branch.children.forEach((child) => {
          if (progress < child.appearAt) return;
          const cReveal = clamp01(((progress - child.appearAt) / Math.max(0.01, 1 - child.appearAt)) * child.growthSpeed * 1.3);
          if (cReveal <= 0) return;
          strokeGrowingLine(
            child.pts, cReveal,
            child.baseWidth * widthScale, child.baseWidth * widthScale * 0.1,
            child.alpha, time, (u, tm) => childWaveAt(trunk, branch, child, u, tm),
            (t, a) => rootColorAt(child.pts[0].x + t * 0.1, a * (1 - t))
          );
          if (child.hasLeaf && cReveal > 0.55) {
            const last = child.pts[child.pts.length - 1];
            const prevPt = child.pts[child.pts.length - 2];
            const angle = Math.atan2((last.y - prevPt.y) * H, (last.x - prevPt.x) * W);
            const tipPt = pointAt(child.pts, cReveal, (u, tm) => childWaveAt(trunk, branch, child, u, tm), time);
            const leafSize = (4.5 + child.baseWidth * 2) * Math.max(widthScale, 0.7);
            const leafAlpha = Math.min(1, (cReveal - 0.55) / 0.3) * Math.max(child.alpha, 0.7);
            drawLeaf(tipPt, angle, leafSize, rootColorAt(child.pts[0].x + 0.05, 1), leafAlpha);
          }
        });
      });
    });

    // ambient embers — count and brightness both grow subtly with tap count
    const activity = 1 + progress * 0.6;
    const activeEmberCount = Math.min(brEmbers.length, BR_EMBER_BASE + Math.round(tapPct * BR_EMBER_MAX_EXTRA));
    const brightBoost = 1 + tapPct * 0.9;
    brEmbers.slice(0, activeEmberCount).forEach((e) => {
      if (!reducedMotion) {
        e.x += e.vx * activity * 16;
        e.y += e.vy * activity * 16 + Math.sin(time * 0.0004 + e.phase) * 0.00002;
        if (e.x > 1.05) { e.x = -0.05; e.y = Math.random(); }
      }
      const flicker = reducedMotion ? 1 : 0.7 + 0.3 * Math.sin(time * 0.0015 + e.phase);
      bctx.save();
      bctx.shadowColor = 'rgba(196, 181, 253, 0.9)';
      bctx.shadowBlur = 8 + tapPct * 6;
      bctx.beginPath();
      bctx.arc(e.x * W, e.y * H, e.size * (1 + tapPct * 0.3), 0, Math.PI * 2);
      bctx.fillStyle = `rgba(238, 225, 255, ${Math.min(1, (e.baseAlpha * flicker + 0.15) * brightBoost)})`;
      bctx.fill();
      bctx.restore();
    });

    // flow embers riding along roots and branches, spiritual -> physical
    brFlowEmbers.forEach((fe) => {
      const owner = fe.growthSpeedOwner;
      const reveal = clamp01(progress * owner.growthSpeed * 1.15);
      if (progress < fe.appearAt || reveal < 0.05) return;
      if (!reducedMotion) {
        fe.t += fe.speed * activity * 16;
        if (fe.t > reveal) fe.t = 0;
      } else {
        fe.t = Math.min(fe.t, reveal);
      }
      const p = pointAt(fe.path, Math.min(fe.t, reveal), null, time);
      const alpha = Math.min(1, 0.85 * (1 - fe.t * 0.35) * (1 + tapPct * 0.6));
      bctx.save();
      bctx.shadowColor = 'rgba(200, 220, 255, 0.95)';
      bctx.shadowBlur = 10 + tapPct * 8;
      bctx.beginPath();
      bctx.arc(p.x * W, p.y * H, fe.size * (1 + tapPct * 0.25), 0, Math.PI * 2);
      bctx.fillStyle = `rgba(255, 250, 245, ${alpha})`;
      bctx.fill();
      bctx.restore();
    });
  }

  const BASE_GROWTH = 0.82; // scenes start mostly established; taps add subtle refinement
  let progress = BASE_GROWTH;
  let targetProgress = BASE_GROWTH;
  let tapPct = 0; // raw count/100, drives density + brightness

  // bridge so the separate WebGL (river) module script can read live app state
  window.__godScene = {
    get scene() { return currentScene; },
    get tapPct() { return tapPct; },
    get progress() { return progress; },
    get hasVerse() { return !!(verseState && verseState.text); },
  };

  function setRootProgress(p) {
    tapPct = clamp01(p);
    targetProgress = BASE_GROWTH + (1 - BASE_GROWTH) * tapPct;
    if (reducedMotion) {
      progress = targetProgress;
      renderScene(0);
    }
  }

  // "river" is rendered by the separate WebGL scene (see the module script below);
  // the 2D canvas only draws the branches scene.
  function renderScene(time) {
    if (currentScene !== 'branches') return;
    bctx.clearRect(0, 0, W, H);
    renderBranches(time);
  }

  // the floating angelic/cosmic symbols and realm labels are a "branches" scene
  // motif only — the river scene has no such manifesting/realm attribute
  function applySceneChrome(scene) {
    const show = scene === 'branches' ? '' : 'none';
    document.querySelectorAll('.realm').forEach((el) => { el.style.display = show; });
    const symbolsEl = document.getElementById('symbols');
    if (symbolsEl) symbolsEl.style.display = show;

    const canvas2d = document.getElementById('bg-canvas');

    if (canvasGl) canvasGl.style.display = scene === 'river' ? 'block' : 'none';

    // swap which half of the debug panel (C) is shown — the settings underneath
    // are untouched, so nothing resets when switching scenes or toggling the panel

    const branchesGroup = document.getElementById('branches-ctrl-group');
    if (riverGroup) riverGroup.style.display = scene === 'river' ? '' : 'none';
    if (branchesGroup) branchesGroup.style.display = scene === 'branches' ? '' : 'none';
  }

  function setScene(scene) {
    if (scene !== 'branches' && scene !== 'river') return;
    currentScene = scene;
    try { localStorage.setItem(SCENE_KEY, scene); } catch (e) {}
    document.querySelectorAll('#scene-toggle button').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.scene === scene);
    });
    applySceneChrome(scene);
    renderScene(0);
  }

  function tick(time) {
    progress += (targetProgress - progress) * 0.05;
    renderScene(time);
    requestAnimationFrame(tick);
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  if (reducedMotion) {

  } else {

  function playAlertSound() {
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      [0, 0.15, 0.3].forEach((delay) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0, now + delay);
        gain.gain.linearRampToValueAtTime(0.7, now + delay + 0.02);
        gain.gain.linearRampToValueAtTime(0, now + delay + 0.13);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now + delay);
        osc.stop(now + delay + 0.15);
      });
    } catch (e) {}
  }

  function playTapSound() {
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.06);
      gain.gain.setValueAtTime(0.55, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.06);
    } catch (e) {}
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // lines starting with "-" render as bullet points; everything else stays a plain line
  // words matched so far are tracked by index into this flat list; wordSpans()
  // rebuilds it after each render since renderVerseLines assigns data-widx
  let verseWordCount = 0;

  function wrapWords(text) {
    return text.split(/(\s+)/).map((tok) => {
      if (!tok.trim()) return tok;
      const idx = verseWordCount++;
      return `<span class="verse-word" data-widx="${idx}">${escapeHtml(tok)}</span>`;
    }).join('');
  }

  function renderVerseLines(text) {
    verseWordCount = 0;
    const records = text.split('\n').map((line) => {
      const trimmed = line.trim();
      const isBullet = /^-\s+/.test(trimmed) || trimmed === '-';
      return { isBullet, text: isBullet ? trimmed.replace(/^-\s*/, '') : line };
    });
    // attach the quote marks to the actual first/last line of text, rather than
    // as CSS-generated content — those sit oddly alone when content is multi-block
    if (records.length) {
      records[0].text = '“' + records[0].text;
      records[records.length - 1].text += '”';
    }
    let html = '';
    let inList = false;
    records.forEach((r) => {
      if (r.isBullet) {
        if (!inList) { html += '<ul class="verse-list">'; inList = true; }
        html += `<li>${wrapWords(r.text)}</li>`;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<div class="verse-line">${r.text.trim() ? wrapWords(r.text) : '&nbsp;'}</div>`;
      }
    });
    if (inList) html += '</ul>';
    return html;
  }

  function renderVerse() {

  function openVerseForm() {

    verseRefInput.value = (verseState && verseState.ref) || '';
    verseForm.classList.add('show');

  function saveVerse() {

    verseState = { text, ref: verseRefInput.value.trim() };
    try { localStorage.setItem(VERSE_KEY, JSON.stringify(verseState)); } catch (e) {}
