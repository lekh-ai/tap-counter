<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tap Counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 0%, #1c1830 0%, #0a0a12 55%, #050507 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  #app {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* ambient glow blobs */
  #app::before, #app::after {
    content: "";
    position: absolute;
    width: 45vmax; height: 45vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  #app::before {
    background: #7c3aed;
    top: -15vmax; left: -10vmax;
  }
  #app::after {
    background: #06b6d4;
    bottom: -15vmax; right: -10vmax;
  }

  #ring-wrap {
    position: relative;
    width: min(60vmin, 480px);
    height: min(60vmin, 480px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  #ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  #ring circle {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
  }

  #ring .track {
    stroke: rgba(255,255,255,0.08);
  }

  #ring .progress {
    stroke: url(#grad);
    stroke-dasharray: 1256;
    stroke-dashoffset: 1256;
    transition: stroke-dashoffset 0.25s ease;
  }

  #core {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 0 60px rgba(124, 58, 237, 0.15), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  #count {
    font-size: 16vw;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: transform 0.08s ease;
  }

  #count.pulse {
    transform: scale(1.1);
  }

  #hint {
    margin-top: 10px;
    font-size: clamp(12px, 1.6vmin, 15px);
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 600;
  }

  #phase {
    margin-top: 6px;
    font-size: clamp(11px, 1.4vmin, 13px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 700;
    background: linear-gradient(135deg, #c4b5fd, #67e8f9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #phase.show {
    opacity: 1;
    transform: translateY(0);
  }

  #scene-toggle {
    position: fixed;
    top: 24px;
    left: 24px;
    display: flex;
    gap: 4px;
    padding: 4px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    z-index: 10;
  }

  #scene-toggle button {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.5);
    background: transparent;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  #scene-toggle button.active {
    color: #fff;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
  }

  #scene-toggle button:not(.active):hover {
    color: rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.08);
  }

  #volume {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    z-index: 10;
  }

  #volume svg {
    width: 16px;
    height: 16px;
    color: rgba(255,255,255,0.55);
    flex-shrink: 0;
  }

  #volume input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 90px;
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(to right, #7c3aed, #06b6d4);
    cursor: pointer;
  }

  #volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(196, 181, 253, 0.9);
    cursor: pointer;
  }

  #volume input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(196, 181, 253, 0.9);
    cursor: pointer;
  }

  #reset {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }

  #reset:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
  }

  #reset:active {
    transform: translateX(-50%) scale(0.96);
  }

  #reset kbd {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 12px;
    font-family: inherit;
  }

  #toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    padding: 16px 28px;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    border-radius: 14px;
    font-weight: 700;
    font-size: clamp(14px, 2vmin, 18px);
    box-shadow: 0 10px 40px rgba(124, 58, 237, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 20;
    white-space: nowrap;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #titles {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    text-align: center;
    width: 90vw;
    max-width: 700px;
    pointer-events: none;
  }

  #title {
    font-size: clamp(32px, 6vmin, 56px);
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #fff 0%, #c4b5fd 50%, #7c3aed 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(124, 58, 237, 0.5);
  }

  #subtitle {
    margin-top: 10px;
    font-size: clamp(12px, 1.8vmin, 16px);
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.01em;
  }

  /* realms */
  .realm {
    position: fixed;
    top: 0; bottom: 0;
    width: min(14vw, 140px);
    z-index: 0;
    pointer-events: none;
  }
  .realm.spiritual {
    left: 0;
    background: linear-gradient(to right, rgba(124,58,237,0.28), transparent);
  }
  .realm.physical {
    right: 0;
    background: linear-gradient(to left, rgba(6,182,212,0.22), transparent);
  }
  .realm span {
    position: absolute;
    top: 50%; left: 50%;
    writing-mode: vertical-rl;
    transform: translate(-50%, -50%);
    text-transform: uppercase;
    letter-spacing: 0.3em;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.3);
  }

  /* root/ember background */
  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  /* WebGL river scene */
  #bg-webgl {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    display: none;
  }

  /* floating cosmic / angelic symbols */
  #symbols {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .symbol {
    position: absolute;
    filter: drop-shadow(0 0 6px currentColor);
    animation: symbol-float ease-in-out infinite;
    will-change: transform, opacity;
  }
  .symbol svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .symbol.spirit { color: rgba(196, 181, 253, 0.55); }
  .symbol.phys { color: rgba(103, 232, 249, 0.5); }

  @keyframes symbol-float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-16px) rotate(4deg); }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="realm spiritual"><span>Spiritual</span></div>
<div class="realm physical"><span>Physical</span></div>
<canvas id="bg-canvas"></canvas>
<canvas id="bg-webgl"></canvas>
<div id="symbols"></div>
<div id="app">
  <div id="titles">
    <div id="title">The God Challenge</div>
    <div id="subtitle">Imagining, Musing, Muttering &rarr; Manifesting to Natural from Spiritual</div>
  </div>
  <div id="ring-wrap">
    <svg id="ring" viewBox="0 0 420 420">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed"/>
          <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="210" cy="210" r="200"/>
      <circle class="progress" cx="210" cy="210" r="200"/>
    </svg>
    <div id="core">
      <div id="count">0</div>
      <div id="hint">tap anywhere</div>
      <div id="phase"></div>
    </div>
  </div>
</div>

<div id="toast">🎉 100 taps reached!</div>
<div id="scene-toggle">
  <button type="button" data-scene="branches">Branches</button>
  <button type="button" data-scene="river">River</button>
</div>
<button id="reset">Reset <kbd>R</kbd></button>
<div id="volume">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="4 9 8 9 12 5 12 19 8 15 4 15" fill="currentColor" stroke="none"/>
    <path d="M16 8a5 5 0 0 1 0 8"/>
    <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
  </svg>
  <input type="range" id="volume-slider" min="0" max="100" value="70" aria-label="Effect volume">
</div>

<script>
  const STORAGE_KEY = 'god-challenge-count';
  let count = 0;
  try {
    const saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (Number.isFinite(saved) && saved >= 0) count = Math.min(saved, 100);
  } catch (e) {}

  const countEl = document.getElementById('count');
  const app = document.getElementById('app');
  const resetBtn = document.getElementById('reset');
  const progressEl = document.querySelector('#ring .progress');
  const toastEl = document.getElementById('toast');
  const phaseEl = document.getElementById('phase');
  const CIRC = 1256; // 2 * PI * 200, matches stroke-dasharray

  const PHASES = [
    { max: 25, label: 'Imagining' },
    { max: 50, label: 'Musing' },
    { max: 75, label: 'Muttering' },
    { max: 100, label: 'Manifesting' },
  ];
  function phaseForCount(c) {
    return PHASES.find((p) => c <= p.max) || PHASES[PHASES.length - 1];
  }
  let lastPhaseLabel = null;
  function updatePhase() {
    const phase = phaseForCount(count);
    if (phase.label !== lastPhaseLabel) {
      lastPhaseLabel = phase.label;
      phaseEl.textContent = phase.label;
      phaseEl.classList.remove('show');
      void phaseEl.offsetWidth;
      phaseEl.classList.add('show');
    }
  }

  const MILESTONES = {
    25: 'Imagining takes root 🌱',
    50: 'Musing deepens the current 🌊',
    75: 'Muttering becomes conviction 🔥',
    100: '🎉 Manifesting — 100 taps reached!',
  };
  const VOLUME_KEY = 'god-challenge-volume';
  const volumeSlider = document.getElementById('volume-slider');
  let effectVolume = 0.7;
  try {
    const savedVol = parseInt(localStorage.getItem(VOLUME_KEY), 10);
    if (Number.isFinite(savedVol) && savedVol >= 0 && savedVol <= 100) effectVolume = savedVol / 100;
  } catch (e) {}
  volumeSlider.value = Math.round(effectVolume * 100);

  let audioCtx = null;
  let masterGain = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = effectVolume;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  volumeSlider.addEventListener('input', () => {
    effectVolume = volumeSlider.value / 100;
    if (masterGain) masterGain.gain.value = effectVolume;
    try { localStorage.setItem(VOLUME_KEY, volumeSlider.value); } catch (e) {}
  });

  function updateDisplay() {
    countEl.textContent = count;
    countEl.classList.remove('pulse');
    void countEl.offsetWidth;
    countEl.classList.add('pulse');

    const pct = Math.min(count / 100, 1);
    progressEl.style.strokeDashoffset = CIRC * (1 - pct);
    setRootProgress(pct);
    updatePhase();

    try { localStorage.setItem(STORAGE_KEY, String(count)); } catch (e) {}
  }

  // ---- Root / ember background engine (canvas) ----
  const canvas = document.getElementById('bg-canvas');
  const bctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Floating cosmic / angelic background symbols (line-art SVG, no emoji) ----
  const SPIRIT_ICONS = [
    // dove / wing
    '<svg viewBox="0 0 24 24"><path d="M2 13c3-3 6-1 8 1 1-4 4-7 8-7-1 3-3 5-3 5s3 0 5 2c-4 1-7 0-9-1-1 2-3 4-6 4 1-1 1-2 1-3-2 1-3 0-4-1z"/></svg>',
    // feather
    '<svg viewBox="0 0 24 24"><path d="M18 3c-6 1-11 6-12 12l-2 6 6-2C16 17 21 12 22 6l-4 4M13 8l-4 4M15 11l-4 4"/></svg>',
    // halo ring
    '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7" ry="2.4"/><path d="M12 9v11M9 15h6"/></svg>',
    // radiant star
    '<svg viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M5.6 5.6l3 3M15.4 15.4l3 3M18.4 5.6l-3 3M8.6 15.4l-3 3"/></svg>',
    // sparkle
    '<svg viewBox="0 0 24 24"><path d="M12 3c0 4 2 6 6 6-4 0-6 2-6 6 0-4-2-6-6-6 4 0 6-2 6-6z"/></svg>',
  ];
  const PHYS_ICONS = [
    // ringed planet
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="3" transform="rotate(-20 12 12)"/></svg>',
    // crescent moon
    '<svg viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 0 18 7 7 0 1 1 0-18z"/></svg>',
    // simple star
    '<svg viewBox="0 0 24 24"><path d="M12 4l2.2 5.6L20 11l-4.6 3.6L16.5 20 12 16.8 7.5 20l1.1-5.4L4 11l5.8-1.4z"/></svg>',
    // orbit / galaxy swirl
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(15 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-35 12 12)"/></svg>',
    // leaf
    '<svg viewBox="0 0 24 24"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16z"/><path d="M5 19c3-5 7-9 12-11"/></svg>',
  ];

  function initSymbols() {
    const container = document.getElementById('symbols');
    const total = 16;
    for (let i = 0; i < total; i++) {
      const isSpirit = i % 2 === 0;
      const icons = isSpirit ? SPIRIT_ICONS : PHYS_ICONS;
      const el = document.createElement('div');
      el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
      el.className = `symbol ${isSpirit ? 'spirit' : 'phys'}`;
      const leftPct = isSpirit ? Math.random() * 30 : 70 + Math.random() * 30;
      const size = 16 + Math.random() * 22;
      el.style.left = `${leftPct}%`;
      el.style.top = `${8 + Math.random() * 78}%`;
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      el.style.opacity = (0.25 + Math.random() * 0.35).toFixed(2);
      if (!reducedMotion) {
        el.style.animationDuration = `${8 + Math.random() * 10}s`;
        el.style.animationDelay = `${-Math.random() * 10}s`;
      } else {
        el.style.animation = 'none';
      }
      container.appendChild(el);
    }
  }
  initSymbols();

  let W = 0, H = 0;
  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }

  // ---- Scene toggle: "branches" (root network) vs "river" (temple river) ----
  const SCENE_KEY = 'god-challenge-scene';
  let currentScene = 'branches';
  try {
    const savedScene = localStorage.getItem(SCENE_KEY);
    if (savedScene === 'branches' || savedScene === 'river') currentScene = savedScene;
  } catch (e) {}

  const spiritColor = [124, 58, 237];
  const physColor = [6, 182, 212];
  function gradientColorAt(t, alpha) {
    const c = t < 0.6
      ? spiritColor
      : [
          lerp(spiritColor[0], physColor[0], (t - 0.6) / 0.4),
          lerp(spiritColor[1], physColor[1], (t - 0.6) / 0.4),
          lerp(spiritColor[2], physColor[2], (t - 0.6) / 0.4),
        ];
    return `rgba(${c[0] | 0}, ${c[1] | 0}, ${c[2] | 0}, ${alpha})`;
  }
  const rootColorAt = gradientColorAt;

  // ---- Scene: branches (root network with leaves) ----
  // wave constants — each depth has its own frequency, but a child always inherits
  // its parent's live offset at the exact attachment point so joins never separate.
  const TRUNK_FREQ = 0.0005, BRANCH_FREQ = 0.0011, CHILD_FREQ = 0.0014;
  const TRUNK_WAVE_AMP = 0.006, BRANCH_WAVE_AMP = 0.014, CHILD_WAVE_AMP = 0.018;

  // build a jagged organic polyline of normalized points (x,y in 0..1)
  function buildPolyline(x0, y0, x1, y1, segments, wobble) {
    const pts = [{ x: x0, y: y0 }];
    for (let i = 1; i < segments; i++) {
      const t = i / segments;
      const bow = Math.sin(t * Math.PI) * wobble * 0.6;
      pts.push({
        x: lerp(x0, x1, t),
        y: lerp(y0, y1, t) + (Math.random() - 0.5) * wobble + bow * (Math.random() - 0.5),
      });
    }
    pts.push({ x: x1, y: y1 });
    return pts;
  }

  function makeBranch(parentPts, depth, opts) {
    opts = opts || {};
    const idxMax = opts.idxMax || (parentPts.length - 2);
    const idx = 1 + Math.floor(Math.random() * Math.max(1, Math.min(idxMax, parentPts.length - 2)));
    const parentT = idx / (parentPts.length - 1);
    const start = parentPts[idx];
    const dir = Math.random() < 0.5 ? -1 : 1;
    const spanX = rand(0.06, 0.16) * (depth === 1 ? 1 : 0.6);
    const spanY = dir * rand(0.03, 0.09);
    const endX = Math.min(0.94, start.x + spanX);
    const endY = clamp01(start.y + spanY);
    const pts = buildPolyline(start.x, start.y, endX, endY, 4, 0.02);
    const branch = {
      pts,
      parentT,
      phase: rand(0, Math.PI * 2),
      appearAt: opts.appearMax != null ? rand(0, opts.appearMax) : rand(0.02, depth === 1 ? 0.55 : 0.75),
      growthSpeed: rand(0.8, 1.4),
      baseWidth: depth === 1 ? rand(1.1, 1.9) : rand(0.5, 0.9),
      alpha: depth === 1 ? rand(0.55, 0.8) : rand(0.35, 0.55),
      hasLeaf: Math.random() < 0.92,
      children: [],
    };
    if (depth === 1 && Math.random() < 0.8) {
      branch.children.push(makeBranch(pts, 2));
      if (Math.random() < 0.4) branch.children.push(makeBranch(pts, 2));
    }
    return branch;
  }

  function buildTrunks(count) {
    const trunks = [];
    for (let i = 0; i < count; i++) {
      const y = 0.1 + (i * (0.8 / (count - 1))) + rand(-0.02, 0.02);
      const endY = clamp01(y + rand(-0.05, 0.05));
      const pts = buildPolyline(0, y, 0.9, endY, 12, 0.035);
      const trunk = {
        pts,
        growthSpeed: rand(0.85, 1.2),
        baseWidth: rand(2.6, 4.2),
        tipWidth: rand(0.35, 0.6),
        phase: rand(0, Math.PI * 2),
        branches: [],
      };
      const branchCount = 4 + Math.floor(Math.random() * 4);
      for (let b = 0; b < branchCount; b++) trunk.branches.push(makeBranch(pts, 1));

      // extra branches clustered near the spiritual origin, visible from the start,
      // so the root network reads noticeably denser on that side by default
      const denseCount = 5 + Math.floor(Math.random() * 3);
      const idxMax = Math.max(2, Math.floor((pts.length - 2) * 0.35));
      for (let d = 0; d < denseCount; d++) {
        trunk.branches.push(makeBranch(pts, 1, { idxMax, appearMax: 0.08 }));
      }

      trunks.push(trunk);
    }
    return trunks;
  }

  const trunks = buildTrunks(6);

  function trunkWaveAt(trunk, t, time) {
    return TRUNK_WAVE_AMP * t * Math.sin(time * TRUNK_FREQ + trunk.phase);
  }
  function branchWaveAt(trunk, branch, s, time) {
    return trunkWaveAt(trunk, branch.parentT, time) + BRANCH_WAVE_AMP * s * Math.sin(time * BRANCH_FREQ + branch.phase);
  }
  function childWaveAt(trunk, branch, child, u, time) {
    return branchWaveAt(trunk, branch, child.parentT, time) + CHILD_WAVE_AMP * u * Math.sin(time * CHILD_FREQ + child.phase);
  }

  // point along a polyline at normalized reveal fraction t (0..1); waveFn(t, time) supplies extra y-offset
  function pointAt(pts, t, waveFn, time) {
    const total = pts.length - 1;
    const f = clamp01(t) * total;
    const i = Math.min(Math.floor(f), total - 1);
    const local = f - i;
    const a = pts[i], b = pts[Math.min(i + 1, total)];
    const x = lerp(a.x, b.x, local);
    let y = lerp(a.y, b.y, local);
    if (waveFn && !reducedMotion) y += waveFn(t, time);
    return { x, y };
  }

  function strokeGrowingLine(pts, reveal, widthStart, widthEnd, alpha, time, waveFn, colorStops) {
    if (reveal <= 0) return null;
    const steps = Math.max(2, Math.round((pts.length - 1) * clamp01(reveal)) + 1);
    let prev = pointAt(pts, 0, waveFn, time);
    let tip = prev;
    for (let s = 1; s <= steps; s++) {
      const localT = Math.min(1, s / (pts.length - 1));
      const revealT = Math.min(localT, reveal);
      const cur = pointAt(pts, revealT, waveFn, time);
      const segT = revealT;
      const w = lerp(widthStart, widthEnd, segT);
      bctx.beginPath();
      bctx.moveTo(prev.x * W, prev.y * H);
      bctx.lineTo(cur.x * W, cur.y * H);
      bctx.lineWidth = w;
      bctx.strokeStyle = colorStops(segT, alpha);
      bctx.stroke();
      tip = cur;
      prev = cur;
      if (revealT >= reveal) break;
    }
    return tip;
  }

  function drawLeaf(p, angle, size, color, alpha) {
    bctx.save();
    bctx.translate(p.x * W, p.y * H);
    bctx.rotate(angle);
    bctx.globalAlpha = alpha;

    // stem — drawn back along the branch's own direction so the leaf
    // always reads as attached, even when the branch stroke itself is thin/faint
    bctx.beginPath();
    bctx.moveTo(-size * 0.9, 0);
    bctx.lineTo(0, 0);
    bctx.strokeStyle = color;
    bctx.lineWidth = Math.max(1, size * 0.16);
    bctx.lineCap = 'round';
    bctx.stroke();

    bctx.shadowColor = color;
    bctx.shadowBlur = size * 0.6;
    bctx.beginPath();
    bctx.moveTo(0, 0);
    bctx.quadraticCurveTo(size * 0.55, -size * 0.55, size * 1.4, 0);
    bctx.quadraticCurveTo(size * 0.55, size * 0.55, 0, 0);
    bctx.fillStyle = color;
    bctx.fill();
    bctx.shadowBlur = 0;
    bctx.beginPath();
    bctx.moveTo(0, 0);
    bctx.lineTo(size * 1.3, 0);
    bctx.strokeStyle = 'rgba(255,255,255,0.5)';
    bctx.lineWidth = Math.max(0.6, size * 0.08);
    bctx.stroke();
    bctx.restore();
  }

  // ember particles: ambient drifters + a few that ride along trunks toward the physical side
  const BR_EMBER_BASE = 26;
  const BR_EMBER_MAX_EXTRA = 20;
  const brEmbers = [];
  for (let i = 0; i < BR_EMBER_BASE + BR_EMBER_MAX_EXTRA; i++) {
    brEmbers.push({
      x: Math.random(), y: Math.random(),
      vx: rand(0.00006, 0.00016),
      vy: rand(-0.00004, 0.00004),
      size: rand(0.8, 2.2),
      baseAlpha: rand(0.15, 0.4),
      phase: rand(0, Math.PI * 2),
    });
  }
  function makeFlowEmber(path, growthSpeedOwner, appearAt) {
    return {
      path,
      appearAt: appearAt || 0,
      growthSpeedOwner,
      t: Math.random(),
      speed: rand(0.00009, 0.0002),
      size: rand(1.4, 2.4),
    };
  }

  const brFlowEmbers = [];
  trunks.forEach((trunk) => {
    brFlowEmbers.push(makeFlowEmber(trunk.pts, trunk, 0));
    trunk.branches.forEach((branch) => {
      brFlowEmbers.push(makeFlowEmber(branch.pts, trunk, branch.appearAt));
      branch.children.forEach((child) => {
        brFlowEmbers.push(makeFlowEmber(child.pts, trunk, child.appearAt));
      });
    });
  });

  function renderBranches(time) {
    // roots
    trunks.forEach((trunk) => {
      const reveal = clamp01(progress * trunk.growthSpeed * 1.15);
      if (reveal <= 0) return;
      const widthScale = 0.35 + 0.65 * progress;
      strokeGrowingLine(
        trunk.pts, reveal,
        trunk.baseWidth * widthScale, trunk.tipWidth * widthScale,
        0.8, time, (t, tm) => trunkWaveAt(trunk, t, tm),
        (t, a) => rootColorAt(t, a * (1 - t * 0.5))
      );

      trunk.branches.forEach((branch) => {
        if (progress < branch.appearAt) return;
        const bReveal = clamp01(((progress - branch.appearAt) / Math.max(0.01, 1 - branch.appearAt)) * branch.growthSpeed * 1.3);
        if (bReveal <= 0) return;
        strokeGrowingLine(
          branch.pts, bReveal,
          branch.baseWidth * widthScale, branch.baseWidth * widthScale * 0.15,
          branch.alpha, time, (s, tm) => branchWaveAt(trunk, branch, s, tm),
          (t, a) => rootColorAt(branch.pts[0].x + t * 0.1, a * (1 - bReveal * 0.3) * (1 - t))
        );
        if (branch.hasLeaf && bReveal > 0.55) {
          const last = branch.pts[branch.pts.length - 1];
          const prevPt = branch.pts[branch.pts.length - 2];
          const angle = Math.atan2((last.y - prevPt.y) * H, (last.x - prevPt.x) * W);
          const tipPt = pointAt(branch.pts, bReveal, (s, tm) => branchWaveAt(trunk, branch, s, tm), time);
          const leafSize = (6 + branch.baseWidth * 2.2) * Math.max(widthScale, 0.7);
          const leafAlpha = Math.min(1, (bReveal - 0.55) / 0.3) * Math.max(branch.alpha, 0.75);
          drawLeaf(tipPt, angle, leafSize, rootColorAt(branch.pts[0].x + 0.05, 1), leafAlpha);
        }
        branch.children.forEach((child) => {
          if (progress < child.appearAt) return;
          const cReveal = clamp01(((progress - child.appearAt) / Math.max(0.01, 1 - child.appearAt)) * child.growthSpeed * 1.3);
          if (cReveal <= 0) return;
          strokeGrowingLine(
            child.pts, cReveal,
            child.baseWidth * widthScale, child.baseWidth * widthScale * 0.1,
            child.alpha, time, (u, tm) => childWaveAt(trunk, branch, child, u, tm),
            (t, a) => rootColorAt(child.pts[0].x + t * 0.1, a * (1 - t))
          );
          if (child.hasLeaf && cReveal > 0.55) {
            const last = child.pts[child.pts.length - 1];
            const prevPt = child.pts[child.pts.length - 2];
            const angle = Math.atan2((last.y - prevPt.y) * H, (last.x - prevPt.x) * W);
            const tipPt = pointAt(child.pts, cReveal, (u, tm) => childWaveAt(trunk, branch, child, u, tm), time);
            const leafSize = (4.5 + child.baseWidth * 2) * Math.max(widthScale, 0.7);
            const leafAlpha = Math.min(1, (cReveal - 0.55) / 0.3) * Math.max(child.alpha, 0.7);
            drawLeaf(tipPt, angle, leafSize, rootColorAt(child.pts[0].x + 0.05, 1), leafAlpha);
          }
        });
      });
    });

    // ambient embers — count and brightness both grow subtly with tap count
    const activity = 1 + progress * 0.6;
    const activeEmberCount = Math.min(brEmbers.length, BR_EMBER_BASE + Math.round(tapPct * BR_EMBER_MAX_EXTRA));
    const brightBoost = 1 + tapPct * 0.9;
    brEmbers.slice(0, activeEmberCount).forEach((e) => {
      if (!reducedMotion) {
        e.x += e.vx * activity * 16;
        e.y += e.vy * activity * 16 + Math.sin(time * 0.0004 + e.phase) * 0.00002;
        if (e.x > 1.05) { e.x = -0.05; e.y = Math.random(); }
      }
      const flicker = reducedMotion ? 1 : 0.7 + 0.3 * Math.sin(time * 0.0015 + e.phase);
      bctx.save();
      bctx.shadowColor = 'rgba(196, 181, 253, 0.9)';
      bctx.shadowBlur = 8 + tapPct * 6;
      bctx.beginPath();
      bctx.arc(e.x * W, e.y * H, e.size * (1 + tapPct * 0.3), 0, Math.PI * 2);
      bctx.fillStyle = `rgba(238, 225, 255, ${Math.min(1, (e.baseAlpha * flicker + 0.15) * brightBoost)})`;
      bctx.fill();
      bctx.restore();
    });

    // flow embers riding along roots and branches, spiritual -> physical
    brFlowEmbers.forEach((fe) => {
      const owner = fe.growthSpeedOwner;
      const reveal = clamp01(progress * owner.growthSpeed * 1.15);
      if (progress < fe.appearAt || reveal < 0.05) return;
      if (!reducedMotion) {
        fe.t += fe.speed * activity * 16;
        if (fe.t > reveal) fe.t = 0;
      } else {
        fe.t = Math.min(fe.t, reveal);
      }
      const p = pointAt(fe.path, Math.min(fe.t, reveal), null, time);
      const alpha = Math.min(1, 0.85 * (1 - fe.t * 0.35) * (1 + tapPct * 0.6));
      bctx.save();
      bctx.shadowColor = 'rgba(200, 220, 255, 0.95)';
      bctx.shadowBlur = 10 + tapPct * 8;
      bctx.beginPath();
      bctx.arc(p.x * W, p.y * H, fe.size * (1 + tapPct * 0.25), 0, Math.PI * 2);
      bctx.fillStyle = `rgba(255, 250, 245, ${alpha})`;
      bctx.fill();
      bctx.restore();
    });
  }

  const BASE_GROWTH = 0.82; // scenes start mostly established; taps add subtle refinement
  let progress = BASE_GROWTH;
  let targetProgress = BASE_GROWTH;
  let tapPct = 0; // raw count/100, drives density + brightness

  // bridge so the separate WebGL (river) module script can read live app state
  window.__godScene = {
    get scene() { return currentScene; },
    get tapPct() { return tapPct; },
    get progress() { return progress; },
  };

  function setRootProgress(p) {
    tapPct = clamp01(p);
    targetProgress = BASE_GROWTH + (1 - BASE_GROWTH) * tapPct;
    if (reducedMotion) {
      progress = targetProgress;
      renderScene(0);
    }
  }

  // "river" is rendered by the separate WebGL scene (see the module script below);
  // the 2D canvas only draws the branches scene.
  function renderScene(time) {
    if (currentScene !== 'branches') return;
    bctx.clearRect(0, 0, W, H);
    renderBranches(time);
  }

  // the floating angelic/cosmic symbols and realm labels are a "branches" scene
  // motif only — the river scene has no such manifesting/realm attribute
  function applySceneChrome(scene) {
    const show = scene === 'branches' ? '' : 'none';
    document.querySelectorAll('.realm').forEach((el) => { el.style.display = show; });
    const symbolsEl = document.getElementById('symbols');
    if (symbolsEl) symbolsEl.style.display = show;

    const canvas2d = document.getElementById('bg-canvas');
    const canvasGl = document.getElementById('bg-webgl');
    if (canvas2d) canvas2d.style.display = scene === 'branches' ? 'block' : 'none';
    if (canvasGl) canvasGl.style.display = scene === 'river' ? 'block' : 'none';
  }

  function setScene(scene) {
    if (scene !== 'branches' && scene !== 'river') return;
    currentScene = scene;
    try { localStorage.setItem(SCENE_KEY, scene); } catch (e) {}
    document.querySelectorAll('#scene-toggle button').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.scene === scene);
    });
    applySceneChrome(scene);
    renderScene(0);
  }

  function tick(time) {
    progress += (targetProgress - progress) * 0.05;
    renderScene(time);
    requestAnimationFrame(tick);
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  if (reducedMotion) {
    renderScene(0);
  } else {
    requestAnimationFrame(tick);
  }

  function showToast(message) {
    if (message) toastEl.textContent = message;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function playAlertSound() {
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      [0, 0.15, 0.3].forEach((delay) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0, now + delay);
        gain.gain.linearRampToValueAtTime(0.3, now + delay + 0.02);
        gain.gain.linearRampToValueAtTime(0, now + delay + 0.13);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now + delay);
        osc.stop(now + delay + 0.15);
      });
    } catch (e) {}
  }

  function playTapSound() {
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.06);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.06);
    } catch (e) {}
  }

  function increment() {
    count++;
    updateDisplay();
    playTapSound();
    if (MILESTONES[count]) {
      playAlertSound();
      showToast(MILESTONES[count]);
    }
  }

  function reset() {
    count = 0;
    lastPhaseLabel = null;
    updateDisplay();
  }

  // sync UI with any restored count, without the tap pulse/sound
  countEl.textContent = count;
  progressEl.style.strokeDashoffset = CIRC * (1 - Math.min(count / 100, 1));
  setRootProgress(Math.min(count / 100, 1));
  updatePhase();

  applySceneChrome(currentScene);
  document.querySelectorAll('#scene-toggle button').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.scene === currentScene);
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setScene(btn.dataset.scene);
    });
  });

  app.addEventListener('click', increment);

  resetBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    reset();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
      reset();
    }
  });

  function requestFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  window.addEventListener('load', () => {
    requestFullscreen();
  });

  document.addEventListener('click', function once() {
    if (!document.fullscreenElement) requestFullscreen();
  }, { once: false });
</script>

<script type="module">
  import * as THREE from 'three';
  import { Water } from 'three/addons/objects/Water.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const canvas = document.getElementById('bg-webgl');
  const godScene = () => window.__godScene || { scene: 'branches', tapPct: 0, progress: 0.82 };
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a12, 0.0016);

  const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 1, 4000);
  camera.position.set(0, 95, 150);
  camera.lookAt(70, -10, -140);

  scene.add(new THREE.HemisphereLight(0x9d7bff, 0x08050c, 0.7));
  const sunLight = new THREE.DirectionalLight(0xffdca8, 1.6);
  sunLight.position.set(-260, 120, 0);
  scene.add(sunLight);
  const farLight = new THREE.PointLight(0x67e8f9, 0.9, 900);
  farLight.position.set(260, 80, -230);
  scene.add(farLight);
  const gateLight = new THREE.PointLight(0xffd28a, 1.6, 260);
  gateLight.position.set(-240, 55, 0);
  scene.add(gateLight);

  // a soft environment map gives the glossy stones and pillars real reflections
  // instead of flat, cartoonish shading
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  // ---- river path: winds left (spiritual) to right/far (physical) in world X/Z ----
  const RANGE = 260;
  function pathXZ(u) {
    const x = -RANGE + u * RANGE * 2;
    const z = Math.sin(u * Math.PI * 1.6 + 0.3) * 95 + Math.sin(u * Math.PI * 0.7) * 40 - u * 160;
    return { x, z };
  }
  function pathHalfWidth(u) {
    return 60 + Math.sin(u * 5.5) * 10 - u * 16;
  }
  // a procedurally-painted rock image (not a flat color) gives the terrain real surface detail
  function makeRockTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#0f0a1a';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 2200; i++) {
      const x = Math.random() * 512, y = Math.random() * 512;
      const r = 1 + Math.random() * 5;
      const shade = 10 + Math.random() * 40;
      const tint = Math.random() < 0.5 ? [124, 58, 237] : [255, 200, 90];
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${shade + tint[0] * 0.06}, ${shade + tint[1] * 0.03}, ${shade + tint[2] * 0.05}, ${0.15 + Math.random() * 0.25})`;
      ctx.fill();
    }
    for (let i = 0; i < 60; i++) {
      ctx.strokeStyle = `rgba(0,0,0,${0.2 + Math.random() * 0.2})`;
      ctx.lineWidth = 0.6 + Math.random();
      ctx.beginPath();
      let x = Math.random() * 512, y = Math.random() * 512;
      ctx.moveTo(x, y);
      for (let s = 0; s < 5; s++) {
        x += (Math.random() - 0.5) * 60;
        y += (Math.random() - 0.5) * 60;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(24, 24);
    return tex;
  }
  const rockTexture = makeRockTexture();
  const rockMat = new THREE.MeshStandardMaterial({ map: rockTexture, roughness: 0.92, metalness: 0.08 });

  // dark rocky ground so the river reads as cutting through terrain rather than
  // floating over a hard-edged void, and so the water has something to reflect
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000, 1, 1), rockMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -12; // well below the bank's inner edge (-3) to avoid z-fighting
  scene.add(ground);

  // real riverbank geometry that physically rises out of the water on both sides,
  // instead of the water sitting as a flat rectangle over empty space
  function buildBankGeometry(side) {
    const SEG = 140;
    const positions = [], normals = [], uvs = [];
    const centers = [];
    for (let i = 0; i <= SEG; i++) {
      const u = i / SEG;
      centers.push({ u, ...pathXZ(u), hw: pathHalfWidth(u) });
    }
    for (let i = 0; i <= SEG; i++) {
      const c = centers[i];
      const prev = centers[Math.max(0, i - 1)];
      const next = centers[Math.min(SEG, i + 1)];
      let tx = next.x - prev.x, tz = next.z - prev.z;
      const tl = Math.hypot(tx, tz) || 1;
      tx /= tl; tz /= tl;
      const px = -tz, pz = tx;
      const bankRise = 5 + Math.sin(c.u * 9 + side) * 2.2 + Math.sin(c.u * 3.3) * 1.6;
      const innerR = c.hw - 1; // tuck slightly under the water edge so there's no visible seam
      const outerR = c.hw + 45; // kept narrow relative to curvature so the ribbon can't fold over itself at bends
      positions.push(c.x + px * side * innerR, -3, c.z + pz * side * innerR);
      positions.push(c.x + px * side * outerR, bankRise, c.z + pz * side * outerR);
      normals.push(0, 1, 0, 0, 1, 0);
      uvs.push(c.u * 8, 0, c.u * 8, 3);
    }
    const indices = [];
    for (let i = 0; i < SEG; i++) {
      const a = i * 2, b = i * 2 + 1, cIdx = (i + 1) * 2, d = (i + 1) * 2 + 1;
      indices.push(a, cIdx, b, b, cIdx, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }
  scene.add(new THREE.Mesh(buildBankGeometry(1), rockMat));
  scene.add(new THREE.Mesh(buildBankGeometry(-1), rockMat));

  // a soft, irregular foam texture along both banks — without this the water
  // meets the rock in one hard geometric line, which reads as fake
  function makeFoamTexture() {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 128, 256);
    for (let i = 0; i < 500; i++) {
      const v = Math.random();
      const bias = Math.pow(Math.random(), 1.8); // most blobs cluster near the water edge (v small)
      const y = bias * 256;
      const x = Math.random() * 128;
      const r = 2 + Math.random() * 7;
      const alpha = (1 - bias) * (0.35 + Math.random() * 0.4);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(235, 240, 255, ${alpha})`;
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.flipY = false; // keep v=0 (canvas top, where blobs are biased) mapped to the water-side edge
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.repeat.set(16, 1);
    return tex;
  }
  const foamTexture = makeFoamTexture();

  function buildFoamGeometry(side) {
    const SEG = 140;
    const positions = [], uvs = [];
    const centers = [];
    for (let i = 0; i <= SEG; i++) {
      const u = i / SEG;
      centers.push({ u, ...pathXZ(u), hw: pathHalfWidth(u) });
    }
    for (let i = 0; i <= SEG; i++) {
      const c = centers[i];
      const prev = centers[Math.max(0, i - 1)];
      const next = centers[Math.min(SEG, i + 1)];
      let tx = next.x - prev.x, tz = next.z - prev.z;
      const tl = Math.hypot(tx, tz) || 1;
      tx /= tl; tz /= tl;
      const px = -tz, pz = tx;
      const innerR = c.hw - 6;
      const outerR = c.hw + 16;
      positions.push(c.x + px * side * innerR, 0.4, c.z + pz * side * innerR);
      positions.push(c.x + px * side * outerR, 0.4, c.z + pz * side * outerR);
      uvs.push(c.u * 16, 0, c.u * 16, 1);
    }
    const indices = [];
    for (let i = 0; i < SEG; i++) {
      const a = i * 2, b = i * 2 + 1, cIdx = (i + 1) * 2, d = (i + 1) * 2 + 1;
      indices.push(a, cIdx, b, b, cIdx, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }
  const foamMat = new THREE.MeshBasicMaterial({
    map: foamTexture, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
  scene.add(new THREE.Mesh(buildFoamGeometry(1), foamMat));
  scene.add(new THREE.Mesh(buildFoamGeometry(-1), foamMat));

  function buildRiverGeometry() {
    const SEG = 140;
    const positions = [], normals = [], uvs = [];
    const centers = [];
    for (let i = 0; i <= SEG; i++) {
      const u = i / SEG;
      centers.push({ u, ...pathXZ(u), hw: pathHalfWidth(u) });
    }
    for (let i = 0; i <= SEG; i++) {
      const c = centers[i];
      const prev = centers[Math.max(0, i - 1)];
      const next = centers[Math.min(SEG, i + 1)];
      let tx = next.x - prev.x, tz = next.z - prev.z;
      const tl = Math.hypot(tx, tz) || 1;
      tx /= tl; tz /= tl;
      const px = -tz, pz = tx; // perpendicular in XZ plane
      positions.push(c.x + px * c.hw, 0, c.z + pz * c.hw);
      positions.push(c.x - px * c.hw, 0, c.z - pz * c.hw);
      normals.push(0, 1, 0, 0, 1, 0);
      uvs.push(c.u * 6, 0, c.u * 6, 1);
    }
    const indices = [];
    for (let i = 0; i < SEG; i++) {
      const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
      indices.push(a, c, b, b, c, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    return geo;
  }

  const waterNormals = new THREE.TextureLoader().load(
    'https://threejs.org/examples/textures/waternormals.jpg',
    (tex) => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; }
  );
  const water = new Water(buildRiverGeometry(), {
    textureWidth: 512,
    textureHeight: 512,
    waterNormals,
    sunDirection: sunLight.position.clone().normalize(),
    sunColor: 0xffdca8,
    waterColor: 0x3a2a6e,
    distortionScale: 3.4,
    fog: true,
  });
  water.material.side = THREE.DoubleSide; // guard against winding-order mistakes in the custom ribbon geometry
  scene.add(water);

  // irregular, angular gold nuggets — a jittered icosahedron reads as a real chunky
  // nugget with sharp glinting facets, not a smooth egg or gem
  // IcosahedronGeometry duplicates a vertex at every face corner it touches (so each
  // face can have its own flat normal). Displacing each duplicate by an independent
  // random amount pulls coincident corners apart and tears the mesh open. Hashing the
  // direction instead gives every duplicate of the same corner the identical bump, so
  // the solid stays closed while still reading as an irregular nugget.
  function hashDir(n) {
    const key = Math.round(n.x * 500) * 73856093 ^ Math.round(n.y * 500) * 19349663 ^ Math.round(n.z * 500) * 83492791;
    const h = Math.sin(key) * 43758.5453;
    return h - Math.floor(h);
  }
  function makeNuggetGeometry(size) {
    const geo = new THREE.IcosahedronGeometry(size, 1);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i));
      const n = v.clone().normalize();
      const bump = 0.82 + hashDir(n) * 0.32; // deterministic per-direction displacement
      v.copy(n.multiplyScalar(size * bump));
      pos.setXYZ(i, v.x, v.y * 0.82, v.z); // slight overall squash so it rests naturally
    }
    geo.computeVertexNormals();
    return geo;
  }

  // ---- gold nuggets pouring out from the temple and drifting downstream ----
  const stoneGroup = new THREE.Group();
  scene.add(stoneGroup);
  const STONE_COUNT = 72; // more gold generated from the temple
  const stones = [];
  for (let i = 0; i < STONE_COUNT; i++) {
    // biased toward u≈0 so the visible population reads as emerging from the
    // temple gate and spreading outward, not scattered evenly with no source
    const u = Math.random() * Math.random() * 0.5;
    const size = 3.5 + Math.random() * 8;
    const geo = makeNuggetGeometry(size);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffc040, metalness: 0.92, roughness: 0.22,
      envMapIntensity: 1.8,
      emissive: 0x5a3608, emissiveIntensity: 0.25,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    stoneGroup.add(mesh);
    stones.push({
      mesh, size,
      u,
      offsetFrac: (Math.random() - 0.5) * 0.75,
      driftSpeed: 0.000034 + Math.random() * 0.00007, // faster current carrying the nuggets
      phase: Math.random() * Math.PI * 2,
    });
  }

  // ---- temple gate at the spiritual end, simpler marker gate at the physical end ----
  function makeStonePillar(mat, height) {
    const group = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(16, 6, 16), mat);
    base.position.y = 3;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(6, 6.8, height, 12), mat);
    shaft.position.y = 6 + height / 2;
    const capital = new THREE.Mesh(new THREE.BoxGeometry(16, 6, 16), mat);
    capital.position.y = 6 + height + 3;
    group.add(base, shaft, capital);
    return group;
  }

  // only the spiritual end is "God's temple" — the physical end is a plain stone
  // marker with no inner glow, so it never competes with the temple as a second
  // apparent source and the gold's direction stays unambiguous
  function makeTempleGate(color, isTemple) {
    const group = new THREE.Group();
    const scale = isTemple ? 1.25 : 0.85;
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x2a2436, roughness: 0.85, metalness: 0.1 });
    const pillarHeight = 78 * scale;
    const u = isTemple ? 0 : 1;
    const halfWidth = pathHalfWidth(u); // doorway spacing matches the river's actual width here
    const doorHalf = halfWidth * 0.85;

    const pillarL = makeStonePillar(stoneMat, pillarHeight);
    pillarL.position.x = -doorHalf;
    pillarL.scale.setScalar(scale);
    const pillarR = makeStonePillar(stoneMat, pillarHeight);
    pillarR.position.x = doorHalf;
    pillarR.scale.setScalar(scale);
    group.add(pillarL, pillarR);

    // a layered, flat-topped entablature reads as classical temple stonework
    const spanW = doorHalf * 2 + 16 * scale;
    const pediment = new THREE.Mesh(new THREE.BoxGeometry(spanW, 10 * scale, 22 * scale), stoneMat);
    pediment.position.y = pillarHeight + 17 * scale;
    const pedimentCap = new THREE.Mesh(new THREE.BoxGeometry(spanW * 0.83, 8 * scale, 18 * scale), stoneMat);
    pedimentCap.position.y = pillarHeight + 26 * scale;
    group.add(pediment, pedimentCap);

    // a stone platform/threshold so the gate visually stands on solid ground and
    // meets the water at its feet, instead of floating disconnected from both
    const platform = new THREE.Mesh(new THREE.BoxGeometry(spanW + 20 * scale, 4, halfWidth * 2 + 24 * scale), stoneMat);
    platform.position.y = -2;
    group.add(platform);

    let portal = null;
    if (isTemple) {
      const trimMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.1, metalness: 0.5, roughness: 0.3 });
      const trimTop = new THREE.Mesh(new THREE.BoxGeometry(doorHalf * 2 + 8 * scale, 3 * scale, 3 * scale), trimMat);
      trimTop.position.y = pillarHeight + 10 * scale;
      group.add(trimTop);

      // the doorway itself glows like a divine light is pouring through it
      portal = new THREE.Mesh(
        new THREE.PlaneGeometry(doorHalf * 2, pillarHeight + 4 * scale),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
      );
      portal.position.y = (pillarHeight + 10 * scale) / 2 + 2;
      group.add(portal);
    }

    // face the gate along the river's own direction at this point, so its doorway
    // opens directly onto the water instead of standing sideways to it
    const p0 = pathXZ(u);
    const uAhead = isTemple ? u + 0.02 : u - 0.02;
    const pAhead = pathXZ(uAhead);
    group.position.set(p0.x, 1, p0.z);
    group.lookAt(pAhead.x, 1, pAhead.z);
    return { group, portal };
  }
  const spiritGate = makeTempleGate(0xffd28a, true);
  const physGate = makeTempleGate(0x67e8f9, false);
  scene.add(spiritGate.group, physGate.group);
  gateLight.position.set(spiritGate.group.position.x, 55, spiritGate.group.position.z);

  // ---- golden motes drifting downstream ----
  const MOTE_COUNT = 220; // more gold generated pouring from the temple
  const moteGeo = new THREE.BufferGeometry();
  const motePos = new Float32Array(MOTE_COUNT * 3);
  const moteU = new Float32Array(MOTE_COUNT);
  const moteOffset = new Float32Array(MOTE_COUNT);
  const moteSpeed = new Float32Array(MOTE_COUNT);
  for (let i = 0; i < MOTE_COUNT; i++) {
    moteU[i] = Math.random() * Math.random() * 0.6; // biased near the temple so they visibly pour out of it
    moteOffset[i] = (Math.random() - 0.5) * 1.4;
    moteSpeed[i] = 0.0001 + Math.random() * 0.0002; // faster current
  }
  moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
  function moteSprite() {
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.addColorStop(0, 'rgba(255,244,214,1)');
    g.addColorStop(0.4, 'rgba(255,200,90,0.9)');
    g.addColorStop(1, 'rgba(255,200,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 32, 32);
    return new THREE.CanvasTexture(c);
  }
  const moteMat = new THREE.PointsMaterial({
    size: 6, map: moteSprite(), transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true,
  });
  const motes = new THREE.Points(moteGeo, moteMat);
  scene.add(motes);

  function resizeGl() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resizeGl);
  resizeGl();

  let clock = new THREE.Clock();
  function tickGl() {
    requestAnimationFrame(tickGl);
    const gs = godScene();
    if (gs.scene !== 'river') return;

    const dt = prefersReducedMotion ? 0 : Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    const intensity = 1 + gs.tapPct * 0.7;

    water.material.uniforms['time'].value += dt * 0.8 * intensity;

    // the temple doorway glows brighter as more gold flows from it with taps
    const portalPulse = 0.5 + 0.5 * Math.sin(t * 1.1);
    spiritGate.portal.material.opacity = 0.4 + 0.35 * portalPulse + gs.tapPct * 0.25;
    gateLight.intensity = 1.2 + portalPulse * 0.8 + gs.tapPct * 1.4;

    // stones drift downstream on the surface, bobbing and glowing as they go
    stones.forEach((s) => {
      if (dt > 0) {
        s.u += s.driftSpeed * intensity * 60 * dt;
        if (s.u > 1) s.u -= 1;
      }
      const { x, z } = pathXZ(s.u);
      const hw = pathHalfWidth(s.u);
      const glow = 0.4 + 0.35 * Math.sin(t * (0.8 + s.phase * 0.1) + s.phase);
      s.mesh.material.emissiveIntensity = glow * (1 + gs.tapPct * 0.6);
      s.mesh.position.set(
        x + s.offsetFrac * hw,
        s.size * 0.18 + Math.sin(t * 0.9 + s.phase) * s.size * 0.12,
        z
      );
      s.mesh.rotation.y += dt * 0.15;
    });

    // motes stream from spiritual to physical, looping, brighter/faster with taps
    const positions = moteGeo.attributes.position.array;
    for (let i = 0; i < MOTE_COUNT; i++) {
      if (dt > 0) {
        moteU[i] += moteSpeed[i] * intensity * 60 * dt;
        if (moteU[i] > 1) moteU[i] -= 1;
      }
      const u = moteU[i];
      const { x, z } = pathXZ(u);
      const hw = pathHalfWidth(u);
      positions[i * 3] = x + moteOffset[i] * hw * 0.6;
      positions[i * 3 + 1] = 4 + Math.sin(t * 1.5 + i) * 2;
      positions[i * 3 + 2] = z;
    }
    moteGeo.attributes.position.needsUpdate = true;
    moteMat.opacity = Math.min(1, 0.7 + gs.tapPct * 0.5);

    // gentle cinematic camera sway
    if (!prefersReducedMotion) {
      camera.position.x = Math.sin(t * 0.05) * 14;
      camera.position.y = 95 + Math.sin(t * 0.04) * 6;
      camera.lookAt(70, -10, -140);
    }

    renderer.render(scene, camera);
  }
  tickGl();
</script>
</body>
</html>
